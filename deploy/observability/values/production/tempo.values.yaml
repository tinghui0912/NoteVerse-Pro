# Production overrides for Tempo.
#
# Required Secret:
#
#   observability-s3
#     TEMPO_S3_ENDPOINT
#     TEMPO_S3_REGION
#     TEMPO_S3_BUCKET
#     TEMPO_S3_ACCESS_KEY_ID
#     TEMPO_S3_SECRET_ACCESS_KEY

tempo:
  retention: 336h
  storage:
    trace:
      backend: s3
      s3:
        endpoint: ${TEMPO_S3_ENDPOINT}
        region: ${TEMPO_S3_REGION}
        bucket: ${TEMPO_S3_BUCKET}
        access_key: ${TEMPO_S3_ACCESS_KEY_ID}
        secret_key: ${TEMPO_S3_SECRET_ACCESS_KEY}
        forcepathstyle: false

extraArgs:
  config.expand-env: true

extraEnvFrom:
  - secretRef:
      name: observability-s3

persistence:
  enabled: false
