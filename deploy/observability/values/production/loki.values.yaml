# Production overrides for Loki.
#
# Required Secret:
#
#   observability-s3
#     LOKI_S3_ENDPOINT
#     LOKI_S3_REGION
#     LOKI_S3_BUCKET
#     LOKI_S3_ACCESS_KEY_ID
#     LOKI_S3_SECRET_ACCESS_KEY
#
# Keep Loki labels low-cardinality. Operational IDs belong in the JSON log body,
# not labels.

loki:
  commonConfig:
    path_prefix: /var/loki
  storage:
    type: s3
    bucketNames:
      chunks: ${LOKI_S3_BUCKET}
      ruler: ${LOKI_S3_BUCKET}
      admin: ${LOKI_S3_BUCKET}
    s3:
      endpoint: ${LOKI_S3_ENDPOINT}
      region: ${LOKI_S3_REGION}
      accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
      secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: false
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 720h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 100Gi
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: observability-s3
