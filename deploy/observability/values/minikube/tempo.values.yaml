# Minikube/staging overrides for Tempo.
#
# Required Secret:
#
#   observability-s3
#     TEMPO_S3_ENDPOINT
#     TEMPO_S3_REGION
#     TEMPO_S3_BUCKET
#     TEMPO_S3_ACCESS_KEY_ID
#     TEMPO_S3_SECRET_ACCESS_KEY
#
# The values use runtime environment expansion. Do not render Secret values into
# this file or into release packages.

tempo:
  retention: 168h
  # The default 1024Mi ballast and 30-second liveness window are unsuitable
  # for qemu2 cold starts. This remains a minikube-only compromise.
  memBallastSizeMbs: 128
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  livenessProbe:
    initialDelaySeconds: 90
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 12
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 12
  storage:
    trace:
      backend: s3
      s3:
        endpoint: ${TEMPO_S3_ENDPOINT}
        region: ${TEMPO_S3_REGION}
        bucket: ${TEMPO_S3_BUCKET}
        access_key: ${TEMPO_S3_ACCESS_KEY_ID}
        secret_key: ${TEMPO_S3_SECRET_ACCESS_KEY}
        forcepathstyle: false
  extraArgs:
    config.expand-env: true
  extraEnvFrom:
    - secretRef:
        name: observability-s3

persistence:
  enabled: false
