# Minikube-only overrides for kube-prometheus-stack.
#
# The local minikube profile used for NoteVerse is created with qemu2 extra
# block disks and TopoLVM. Prometheus, Alertmanager, and Grafana use the same
# PVC/StorageClass shape expected in production.
#
# Do not use this file for production.

prometheus:
  prometheusSpec:
    retention: 14d
    retentionSize: 6GB
    containers:
      - name: prometheus
        startupProbe:
          httpGet:
            path: /-/ready
            port: http-web
            scheme: HTTP
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 120
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http-web
            scheme: HTTP
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http-web
            scheme: HTTP
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 12
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: noteverse-local-lvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: noteverse-local-lvm
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

grafana:
  defaultDashboardsEnabled: false
  deploymentStrategy:
    type: Recreate
  sidecar:
    dashboards:
      enabled: false
  persistence:
    enabled: true
    storageClassName: noteverse-local-lvm
    size: 2Gi
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 60
    timeoutSeconds: 10
    failureThreshold: 30
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 300
    timeoutSeconds: 10
    failureThreshold: 12

prometheusOperator:
  tls:
    enabled: false
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false

kube-state-metrics:
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    timeoutSeconds: 10
    failureThreshold: 12
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    timeoutSeconds: 10
    failureThreshold: 12
