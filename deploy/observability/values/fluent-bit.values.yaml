# Fluent Bit values skeleton for NoteVerse Pro.
#
# Chart family: fluent/fluent-bit
# Namespace: observability
#
# This file is intentionally incomplete. Validate against the exact chart
# version before installation.

serviceMonitor:
  enabled: true

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 90
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /api/v2/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 12

config:
  service: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Parsers_File parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020
        Health_Check On

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Refresh_Interval  5
        Rotate_Wait       30
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
        Merge_Log           On
        Merge_Parser        noteverse_json
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name        loki
        Match       kube.*
        Host        ${LOKI_SERVICE_HOST}
        Port        3100
        Line_Format json
        Labels      job=noteverse,namespace=$kubernetes['namespace_name'],container=$kubernetes['container_name']
        Label_Keys  $level
        Auto_Kubernetes_Labels Off

  customParsers: |
    [PARSER]
        Name        noteverse_json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ

# Do not add request_id, score_id, job_id, user_id, revision_id, outbox_id,
# email, file hashes, or storage keys as Loki labels.
