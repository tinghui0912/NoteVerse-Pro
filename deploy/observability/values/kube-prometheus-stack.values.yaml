# kube-prometheus-stack values skeleton for NoteVerse Pro.
#
# Chart family: prometheus-community/kube-prometheus-stack
# Namespace: observability
#
# Validate against the exact chart version before installation.

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  grafana.ini:
    analytics:
      check_for_updates: false
      check_for_plugin_updates: false
      reporting_enabled: false
    news:
      news_feed_enabled: false
    plugins:
      preinstall_disabled: true
      plugin_admin_enabled: false
      plugin_admin_external_manage_enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
    datasources:
      enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          isDefault: true
          jsonData:
            httpMethod: POST
            timeInterval: 30s
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki.observability.svc.cluster.local:3100
          jsonData:
            derivedFields:
              - name: TraceID
                matcherRegex: '\"trace_id\":\\s*\"([0-9a-f]{32})\"'
                datasourceUid: tempo
                url: '$${__value.raw}'
                urlDisplayLabel: View trace
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo.observability.svc.cluster.local:3200
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              tags:
                - key: namespace
                  value: namespace
              filterByTraceID: true

prometheus:
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    scrapeInterval: 30s

alertmanager:
  enabled: true

prometheusOperator:
  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

# Do not add raw request_id, score_id, job_id, user_id, storage_key, or email as
# Prometheus labels.
#
# Grafana admin credentials must be provided through external secret management,
# not committed values.
