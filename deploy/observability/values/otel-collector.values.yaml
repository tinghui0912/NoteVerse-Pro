# OpenTelemetry Collector values skeleton for NoteVerse Pro.
#
# Chart family: open-telemetry/opentelemetry-collector
# Namespace: observability
#
# Validate against the exact chart version before installation.

mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  logsCollection:
    enabled: false
  hostMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: false

config: {}

ports:
  # The ServiceMonitor scrapes Collector self-observability metrics from this
  # listener. Keeping it explicit prevents a chart upgrade from silently
  # creating a ServiceMonitor with no reachable endpoint.
  metrics:
    enabled: true

alternateConfig:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch:
      timeout: 5s
      send_batch_size: 1024
    resource:
      attributes:
        - key: deployment.environment.name
          from_attribute: k8s.namespace.name
          action: insert

  exporters:
    otlp_grpc/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true

  service:
    extensions:
      - health_check
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - resource
          - batch
        exporters:
          - otlp_grpc/tempo

serviceMonitor:
  enabled: true

startupProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12
  httpGet:
    port: 13133
    path: /

livenessProbe:
  initialDelaySeconds: 30
  timeoutSeconds: 5
  failureThreshold: 6
  httpGet:
    port: 13133
    path: /

readinessProbe:
  initialDelaySeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  httpGet:
    port: 13133
    path: /

# Sampling is intentionally not enabled in this skeleton. Decide head/tail
# sampling policy after staging traffic confirms trace volume.
#
# Application code must not export traces to a fallback or default endpoint.
