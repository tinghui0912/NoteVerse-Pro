apiVersion: batch/v1
kind: Job
metadata:
  name: noteverse-model-assets-init
  labels:
    app.kubernetes.io/name: noteverse
    app.kubernetes.io/part-of: noteverse
    app.kubernetes.io/component: model-assets-init
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noteverse
        app.kubernetes.io/part-of: noteverse
        app.kubernetes.io/component: model-assets-init
    spec:
      restartPolicy: Never
      containers:
        - name: model-assets-init
          image: noteverse-backend:replace-me
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/scripts/prepare_model_assets.py
          envFrom:
            - configMapRef:
                name: noteverse-backend-config
            - secretRef:
                name: noteverse-backend-secret
          env:
            - name: HF_HUB_OFFLINE
              value: "false"
            - name: TRANSFORMERS_OFFLINE
              value: "false"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: noteverse-backend-secret
                  key: HF_TOKEN
                  optional: true
          volumeMounts:
            - name: model-assets
              mountPath: /opt/noteverse/models
            - name: legato-repo
              mountPath: /external/legato
              readOnly: true
            - name: work
              mountPath: /var/lib/noteverse/work
      volumes:
        - name: model-assets
          persistentVolumeClaim:
            claimName: noteverse-model-assets
        - name: legato-repo
          persistentVolumeClaim:
            claimName: noteverse-legato-repo
            readOnly: true
        - name: work
          emptyDir: {}
