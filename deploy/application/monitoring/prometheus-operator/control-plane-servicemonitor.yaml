apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: noteverse-control-plane
  labels:
    app.kubernetes.io/name: noteverse
    app.kubernetes.io/part-of: noteverse
    app.kubernetes.io/component: control-plane
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: noteverse
      app.kubernetes.io/component: control-plane
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
