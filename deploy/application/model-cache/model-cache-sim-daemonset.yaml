apiVersion: v1
kind: Namespace
metadata:
  name: noteverse-model-cache-test
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: noteverse-model-cache-sim
  namespace: noteverse-model-cache-test
  labels:
    app.kubernetes.io/name: noteverse
    app.kubernetes.io/part-of: noteverse
    app.kubernetes.io/component: model-cache-sim
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: noteverse
      app.kubernetes.io/component: model-cache-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noteverse
        app.kubernetes.io/part-of: noteverse
        app.kubernetes.io/component: model-cache-sim
    spec:
      nodeSelector:
        noteverse.io/workload: worker
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: cache-sim
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - 'set -eu

          mkdir -p /node-cache/noteverse/models

          cat > /node-cache/noteverse/models/manifest.json <<EOF

          {"cache":"ready","node":"${NODE_NAME}","mode":"simulation"}

          EOF

          echo "model cache simulation ready on ${NODE_NAME}"

          sleep 3600

          '
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: node-model-cache
          mountPath: /node-cache/noteverse/models
        - name: scratch
          mountPath: /tmp
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          privileged: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: node-model-cache
        hostPath:
          path: /var/lib/noteverse/model-cache-sim
          type: Directory
      - name: scratch
        emptyDir:
          sizeLimit: 32Mi
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: noteverse-model-cache-deny
  namespace: noteverse-model-cache-test
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress: []
  egress: []
  egressDeny:
  - toCIDR:
    - 169.254.169.254/32
    - 100.100.100.200/32
