apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - backend-api-deployment.yaml
  - backend-api-service.yaml
  - control-plane-deployment.yaml
  - control-plane-service.yaml
  - control-plane-network-policy.yaml
  - observability-exporter-deployment.yaml
  - observability-exporter-service.yaml
  - backend-practice-deployment.yaml
  - backend-practice-service.yaml
  - model-cache-agent-daemonset.yaml
  - backend-worker-deployment.yaml
  - backend-beat-deployment.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - platform-admin-deployment.yaml
  - platform-admin-service.yaml
  - platform-admin-network-policy.yaml
  - migration-job.yaml

labels:
  # Workload and Service selectors are explicit in their own manifests. Do not
  # mutate third-party selectors such as NetworkPolicy sources for Envoy.
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: noteverse
      app.kubernetes.io/part-of: noteverse
