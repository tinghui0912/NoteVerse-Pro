apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: noteverse-model-cache-agent
  labels:
    app.kubernetes.io/component: model-cache-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: noteverse
      app.kubernetes.io/part-of: noteverse
      app.kubernetes.io/component: model-cache-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: model-cache-agent
    spec:
      imagePullSecrets:
        - name: noteverse-registry-credentials
      nodeSelector:
        noteverse.io/model-cache: enabled
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: prepare-model-assets
          image: noteverse-backend-worker:replace-me
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/scripts/prepare_model_assets.py
            - --check-scope
            - assets
          envFrom:
            - configMapRef:
                name: noteverse-model-assets-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: noteverse-model-assets-secret
                  key: HF_TOKEN
                  optional: true
          volumeMounts:
            - name: node-model-cache
              mountPath: /opt/noteverse/models
            - name: scratch
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              ephemeral-storage: 128Mi
            limits:
              ephemeral-storage: 3Gi
      containers:
        - name: cache-ready
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - 'set -eu

              echo "model cache ready on ${NODE_NAME}"

              trap : TERM INT

              sleep infinity &

              wait

              '
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: node-model-cache
              mountPath: /opt/noteverse/models
              readOnly: true
            - name: scratch
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              ephemeral-storage: 128Mi
            limits:
              ephemeral-storage: 3Gi
      volumes:
        - name: node-model-cache
          hostPath:
            path: /var/lib/noteverse/models
            type: Directory
        - name: scratch
          emptyDir:
            sizeLimit: 2Gi
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
