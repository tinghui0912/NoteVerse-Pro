apiVersion: apps/v1
kind: Deployment
metadata:
  name: noteverse-backend-beat
  labels:
    app.kubernetes.io/component: backend-beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: noteverse
      app.kubernetes.io/component: backend-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noteverse
        app.kubernetes.io/part-of: noteverse
        app.kubernetes.io/component: backend-beat
    spec:
      imagePullSecrets:
        - name: noteverse-registry-credentials
      containers:
        - name: beat
          image: noteverse-backend-beat:replace-me
          args:
            - beat
          envFrom:
            - configMapRef:
                name: noteverse-backend-config
            - secretRef:
                name: noteverse-backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command:
                - noteverse-entrypoint
                - check
                - --role
                - beat
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -w /var/lib/noteverse/work/celerybeat
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
