apiVersion: apps/v1
kind: Deployment
metadata:
  name: noteverse-backend-worker
  labels:
    app.kubernetes.io/component: backend-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: noteverse
      app.kubernetes.io/part-of: noteverse
      app.kubernetes.io/component: backend-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noteverse
        app.kubernetes.io/part-of: noteverse
        app.kubernetes.io/component: backend-worker
    spec:
      imagePullSecrets:
        - name: noteverse-registry-credentials
      containers:
        - name: worker
          image: noteverse-backend-worker:replace-me
          args:
            - worker
          envFrom:
            - configMapRef:
                name: noteverse-worker-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-worker-secret
                  key: DATABASE_URL
            - name: SCHEDULER_LOCK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-worker-secret
                  key: SCHEDULER_LOCK_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-worker-secret
                  key: REDIS_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-worker-secret
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: noteverse-worker-secret
                  key: CELERY_RESULT_BACKEND
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: noteverse-worker-secret
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: noteverse-worker-secret
                  key: S3_SECRET_ACCESS_KEY
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: noteverse-worker-secret
                  key: RESEND_API_KEY
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 12Gi
