apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: noteverse-backend-practice
  labels:
    app.kubernetes.io/component: backend-practice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: noteverse-backend-practice
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
