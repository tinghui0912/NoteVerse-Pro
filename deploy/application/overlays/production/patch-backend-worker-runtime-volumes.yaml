apiVersion: apps/v1
kind: Deployment
metadata:
  name: noteverse-backend-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - name: model-assets
              mountPath: /opt/noteverse/models
              readOnly: true
            - name: legato-repo
              mountPath: /external/legato
              readOnly: true
            - name: work
              mountPath: /var/lib/noteverse/work
      volumes:
        - name: model-assets
          persistentVolumeClaim:
            claimName: noteverse-model-assets
            readOnly: true
        - name: legato-repo
          persistentVolumeClaim:
            claimName: noteverse-legato-repo
            readOnly: true
        - name: work
          emptyDir: {}
