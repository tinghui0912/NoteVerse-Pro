apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: noteverse-frontend
  labels:
    app.kubernetes.io/component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: noteverse-frontend
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
