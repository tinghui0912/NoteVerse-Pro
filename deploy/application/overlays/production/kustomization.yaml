apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: noteverse-production

resources:
  - ../../base
  - ingress.yaml
  - pdb-backend-api.yaml
  - pdb-frontend.yaml
  - hpa-backend-api.yaml
  - hpa-frontend.yaml

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/instance: noteverse-production
      app.kubernetes.io/environment: production

images:
  - name: noteverse-backend
    newName: registry.example.invalid/noteverse/backend
    newTag: production-replace-me
  - name: noteverse-frontend
    newName: registry.example.invalid/noteverse/frontend
    newTag: production-replace-me

configMapGenerator:
  - name: noteverse-backend-config
    envs:
      - backend-config.env
  - name: noteverse-frontend-config
    envs:
      - frontend-config.env

generatorOptions:
  disableNameSuffixHash: true

replicas:
  - name: noteverse-backend-api
    count: 3
  - name: noteverse-backend-worker
    count: 1
  - name: noteverse-frontend
    count: 3

patches:
  - path: patch-backend-api-runtime-volumes.yaml
  - path: patch-backend-worker-runtime-volumes.yaml
  - path: patch-backend-beat-runtime-volumes.yaml
  - path: patch-backend-worker-scheduling.yaml
  - path: patch-production-resources.yaml
