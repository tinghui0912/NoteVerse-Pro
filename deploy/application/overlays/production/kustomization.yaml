apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: noteverse-production

resources:
  - ../../base
  - gateway.yaml
  - pdb-backend-api.yaml
  - pdb-customer-web.yaml
  - hpa-backend-api.yaml
  - hpa-customer-web.yaml

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/instance: noteverse-production
      app.kubernetes.io/environment: production

images:
  - name: noteverse-backend-api
    newName: registry.example.invalid/noteverse/backend-api
    newTag: production-replace-me
  - name: noteverse-backend-worker
    newName: registry.example.invalid/noteverse/backend-worker
    newTag: production-replace-me
  - name: noteverse-backend-beat
    newName: registry.example.invalid/noteverse/backend-beat
    newTag: production-replace-me
  - name: noteverse-customer-web
    newName: registry.example.invalid/noteverse/customer-web
    newTag: production-replace-me
  - name: noteverse-platform-admin
    newName: registry.example.invalid/noteverse/platform-admin
    newTag: production-replace-me

configMapGenerator:
  - name: noteverse-beat-config
    envs:
      - beat-config.env
  - name: noteverse-control-plane-config
    envs:
      - control-plane-config.env
  - name: noteverse-customer-api-config
    envs:
      - customer-api-config.env
  - name: noteverse-model-assets-config
    envs:
      - model-assets-config.env
  - name: noteverse-observability-config
    envs:
      - observability-config.env
  - name: noteverse-worker-config
    envs:
      - worker-config.env
  - name: noteverse-customer-web-config
    envs:
      - customer-web-config.env

generatorOptions:
  disableNameSuffixHash: true

replicas:
  - name: noteverse-backend-api
    count: 3
  - name: noteverse-backend-worker
    count: 1
  - name: noteverse-customer-web
    count: 3

patches:
  - path: patch-backend-api-runtime-volumes.yaml
  - path: patch-backend-worker-runtime-volumes.yaml
  - path: patch-backend-beat-runtime-volumes.yaml
  - path: patch-backend-worker-scheduling.yaml
  - path: patch-production-resources.yaml
