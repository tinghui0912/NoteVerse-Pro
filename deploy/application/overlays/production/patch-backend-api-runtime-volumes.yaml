apiVersion: apps/v1
kind: Deployment
metadata:
  name: noteverse-backend-api
spec:
  template:
    spec:
      containers:
        - name: api
          volumeMounts:
            - name: model-assets
              mountPath: /opt/noteverse/models
              readOnly: true
            - name: work
              mountPath: /var/lib/noteverse/work
      volumes:
        - name: model-assets
          persistentVolumeClaim:
            claimName: noteverse-model-assets
            readOnly: true
        - name: work
          emptyDir: {}
