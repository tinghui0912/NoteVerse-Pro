apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: noteverse-tls
  labels:
    app.kubernetes.io/component: tls
spec:
  secretName: noteverse-staging-tls
  dnsNames:
    - staging.noteverse.example.invalid
    - admin.staging.noteverse.example.invalid
  issuerRef:
    name: letsencrypt-production-dns01
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: noteverse
  labels:
    app.kubernetes.io/component: gateway
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: web-https
      hostname: staging.noteverse.example.invalid
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: noteverse-staging-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: admin-https
      hostname: admin.staging.noteverse.example.invalid
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: noteverse-staging-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: noteverse-web
  labels:
    app.kubernetes.io/component: routing
spec:
  parentRefs:
    - name: noteverse
      sectionName: web-https
  hostnames:
    - staging.noteverse.example.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/realtime/events
      timeouts:
        request: 0s
        backendRequest: 0s
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains"
      backendRefs:
        - name: noteverse-backend-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains"
      backendRefs:
        - name: noteverse-backend-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains"
      backendRefs:
        - name: noteverse-customer-web
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: noteverse-platform-admin
  labels:
    app.kubernetes.io/component: routing
spec:
  parentRefs:
    - name: noteverse
      sectionName: admin-https
  hostnames:
    - admin.staging.noteverse.example.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains"
      backendRefs:
        - name: noteverse-platform-admin
          port: 3000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: noteverse-customer-body-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: noteverse-web
  requestBuffer:
    limit: 32Mi
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: noteverse-operator-body-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: noteverse-platform-admin
  requestBuffer:
    limit: 512Ki
