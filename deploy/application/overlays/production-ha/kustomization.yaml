apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Enable only after staging has proven the PostgreSQL Beat leader lock.
resources:
  - ../production
  - pdb-backend-beat.yaml

patches:
  - path: patch-backend-beat-ha.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: noteverse-backend-beat
    path: patch-backend-beat-ha-topology.yaml
