apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: noteverse-staging

resources:
  - base
  - gateway.yaml

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/instance: noteverse-staging
      app.kubernetes.io/environment: staging

images:
  - name: noteverse-backend-api
    newName: ghcr.io/tinghui0912/noteverse/backend-api
    digest: sha256:093b3231a640a52d67e6bdab46e013f406a0313b5c12dc0cbf0ba92bb386f255
  - name: noteverse-backend-practice
    newName: ghcr.io/tinghui0912/noteverse/backend-practice
    digest: sha256:c2f3cbaece59b614ad5683f0fd44b7b6cc287da87a1277c2a3b682ab966d72d6
  - name: noteverse-backend-worker
    newName: ghcr.io/tinghui0912/noteverse/backend-worker
    digest: sha256:54112e287f4c6861a4e5b6d84ab35746a1ee9e0583fd034ece1d0811175742e2
  - name: noteverse-backend-beat
    newName: ghcr.io/tinghui0912/noteverse/backend-beat
    digest: sha256:9b1af605354877f24c880a1714ff5ccdb7619ad685113698df66991620a4b2df
  - name: noteverse-customer-web
    newName: ghcr.io/tinghui0912/noteverse/customer-web
    digest: sha256:ffeb5b91a26099a796368cda8236cf55ceaf562b77d5b19ac545b8c6381c56f0
  - name: noteverse-platform-admin
    newName: ghcr.io/tinghui0912/noteverse/platform-admin
    digest: sha256:9623c108b0632fd36c10efcb95cd814872fd2e30cbb7fc1e0fccfc50bfeb0f36

  - name: busybox
    newName: busybox
    digest: sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662

configMapGenerator:
  - name: noteverse-backend-config
    envs:
      - backend-config.env
  - name: noteverse-customer-web-config
    envs:
      - customer-web-config.env
  - name: noteverse-control-plane-config
    envs:
      - control-plane-config.env

generatorOptions:
  disableNameSuffixHash: true

replicas:
  - name: noteverse-backend-api
    count: 1
  - name: noteverse-control-plane
    count: 1
  - name: noteverse-backend-practice
    count: 1
  - name: noteverse-backend-worker
    count: 0
  - name: noteverse-customer-web
    count: 1
  - name: noteverse-platform-admin
    count: 1

patches:
  - path: patch-backend-worker-scheduling.yaml
  - path: patch-backend-api-runtime-volumes.yaml
  - path: patch-backend-practice-runtime-volumes.yaml
  - path: patch-backend-worker-runtime-volumes.yaml
  - path: patch-backend-beat-runtime-volumes.yaml
