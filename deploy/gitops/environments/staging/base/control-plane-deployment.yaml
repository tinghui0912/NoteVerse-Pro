apiVersion: apps/v1
kind: Deployment
metadata:
  name: noteverse-control-plane
  labels:
    app.kubernetes.io/component: control-plane
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: noteverse
      app.kubernetes.io/part-of: noteverse
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noteverse
        app.kubernetes.io/part-of: noteverse
        app.kubernetes.io/component: control-plane
    spec:
      imagePullSecrets:
        - name: noteverse-registry-credentials
      containers:
        - name: control-plane
          image: ghcr.io/tinghui0912/noteverse/backend-api@sha256:5e8775ae5f2221d9f5a7827c44a266a3611bde27fb814b5e670923f855880906
          args:
            - control
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: noteverse-control-plane-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-control-plane-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-control-plane-secret
                  key: REDIS_URL
            - name: OPERATOR_TOTP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: noteverse-control-plane-secret
                  key: OPERATOR_TOTP_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 64Mi
