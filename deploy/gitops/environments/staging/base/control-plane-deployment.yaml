apiVersion: apps/v1
kind: Deployment
metadata:
  name: noteverse-control-plane
  labels:
    app.kubernetes.io/component: control-plane
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: noteverse
      app.kubernetes.io/part-of: noteverse
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noteverse
        app.kubernetes.io/part-of: noteverse
        app.kubernetes.io/component: control-plane
    spec:
      imagePullSecrets:
        - name: noteverse-registry-credentials
      containers:
        - name: control-plane
          image: ghcr.io/tinghui0912/noteverse/backend-api@sha256:8a1e5f1cf9230060cbdb7652cb620b8f8d8245b18999212fec28b033d0afb025
          args:
            - control
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: OTEL_SERVICE_NAME
              value: noteverse-control-plane
          envFrom:
            - configMapRef:
                name: noteverse-backend-config
            - configMapRef:
                name: noteverse-control-plane-config
            - secretRef:
                name: noteverse-backend-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
