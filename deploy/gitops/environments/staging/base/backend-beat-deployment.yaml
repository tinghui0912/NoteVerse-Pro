apiVersion: apps/v1
kind: Deployment
metadata:
  name: noteverse-backend-beat
  labels:
    app.kubernetes.io/component: backend-beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: noteverse
      app.kubernetes.io/part-of: noteverse
      app.kubernetes.io/component: backend-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noteverse
        app.kubernetes.io/part-of: noteverse
        app.kubernetes.io/component: backend-beat
    spec:
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: noteverse
              app.kubernetes.io/part-of: noteverse
              app.kubernetes.io/component: backend-beat
      imagePullSecrets:
        - name: noteverse-registry-credentials
      containers:
        - name: beat
          image: ghcr.io/tinghui0912/noteverse/backend-beat@sha256:60bd528fa4955ded97ef86290106e7909a65040cec7303830d30108bb0b6e2b8
          args:
            - beat
          envFrom:
            - configMapRef:
                name: noteverse-beat-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-beat-secret
                  key: DATABASE_URL
            - name: SCHEDULER_LOCK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-beat-secret
                  key: SCHEDULER_LOCK_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-beat-secret
                  key: REDIS_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-beat-secret
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: noteverse-beat-secret
                  key: CELERY_RESULT_BACKEND
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -r /proc/1/cmdline && kill -0 1
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -r /proc/1/cmdline && kill -0 1
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
