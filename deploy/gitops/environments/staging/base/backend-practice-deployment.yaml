apiVersion: apps/v1
kind: Deployment
metadata:
  name: noteverse-backend-practice
  labels:
    app.kubernetes.io/component: backend-practice
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: noteverse
      app.kubernetes.io/part-of: noteverse
      app.kubernetes.io/component: backend-practice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noteverse
        app.kubernetes.io/part-of: noteverse
        app.kubernetes.io/component: backend-practice
    spec:
      imagePullSecrets:
        - name: noteverse-registry-credentials
      containers:
        - name: practice
          image: ghcr.io/tinghui0912/noteverse/backend-practice@sha256:53b9bde7d5dfe8b58286e546218a0644058b0f03bf08e6962362fea1ca8f8b00
          args:
            - practice
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: OTEL_SERVICE_NAME
              value: noteverse-backend-practice
          envFrom:
            - configMapRef:
                name: noteverse-backend-config
            - secretRef:
                name: noteverse-backend-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
