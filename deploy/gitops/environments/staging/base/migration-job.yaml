apiVersion: batch/v1
kind: Job
metadata:
  name: noteverse-db-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noteverse
        app.kubernetes.io/part-of: noteverse
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: noteverse-registry-credentials
      containers:
        - name: migrate
          image: ghcr.io/tinghui0912/noteverse/backend-api@sha256:6b8a2148a353ab9f52e36f7f8475c5e06a5cd9ada201010e2a56d88e525dcfa8
          args:
            - migrate
          envFrom:
            - configMapRef:
                name: noteverse-backend-config
            - secretRef:
                name: noteverse-backend-secret
