apiVersion: batch/v1
kind: Job
metadata:
  name: noteverse-db-migrate
  annotations:
    # Argo CD runs the schema gate before synchronizing ordinary workloads.
    # Direct kubectl release preparation preserves the same ordering itself.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noteverse
        app.kubernetes.io/part-of: noteverse
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: noteverse-registry-credentials
      containers:
        - name: migrate
          image: ghcr.io/tinghui0912/noteverse/backend-api@sha256:da080a0696408162ecc96b160031b70519eeeeb40168b929cc7a00be439c2768
          args:
            - migrate
          envFrom:
            - configMapRef:
                name: noteverse-backend-config
            - secretRef:
                name: noteverse-backend-secret
