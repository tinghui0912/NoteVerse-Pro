apiVersion: batch/v1
kind: Job
metadata:
  name: noteverse-db-migrate
  labels:
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noteverse
        app.kubernetes.io/part-of: noteverse
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: noteverse-registry-credentials
      containers:
        - name: migrate
          image: ghcr.io/tinghui0912/noteverse/backend-api@sha256:7e05e3a88f0935687b18c1e92c21dfe2692b615cb2531b818d02873ecc53376f
          args:
            - migrate
          envFrom:
            - configMapRef:
                name: noteverse-backend-config
            - secretRef:
                name: noteverse-backend-secret
