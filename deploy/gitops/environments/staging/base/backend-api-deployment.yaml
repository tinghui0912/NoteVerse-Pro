apiVersion: apps/v1
kind: Deployment
metadata:
  name: noteverse-backend-api
  labels:
    app.kubernetes.io/component: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: noteverse
      app.kubernetes.io/part-of: noteverse
      app.kubernetes.io/component: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noteverse
        app.kubernetes.io/part-of: noteverse
        app.kubernetes.io/component: backend-api
    spec:
      imagePullSecrets:
        - name: noteverse-registry-credentials
      containers:
        - name: api
          image: ghcr.io/tinghui0912/noteverse/backend-api@sha256:5e8775ae5f2221d9f5a7827c44a266a3611bde27fb814b5e670923f855880906
          args:
            - api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: noteverse-customer-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-customer-api-secret
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: noteverse-customer-api-secret
                  key: SECRET_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-customer-api-secret
                  key: REDIS_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: noteverse-customer-api-secret
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: noteverse-customer-api-secret
                  key: CELERY_RESULT_BACKEND
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: noteverse-customer-api-secret
                  key: S3_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: noteverse-customer-api-secret
                  key: S3_SECRET_ACCESS_KEY
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
