apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: noteverse-default-deny
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress: []
  egress: []
  egressDeny:
  - toCIDR:
    - 169.254.169.254/32
    - 100.100.100.200/32
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: noteverse-backend-api
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: backend-api
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: envoy-gateway-system
        k8s:app.kubernetes.io/component: proxy
        k8s:app.kubernetes.io/managed-by: envoy-gateway
    toPorts:
    - ports:
      - protocol: TCP
        port: '8000'
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: observability
        k8s:app.kubernetes.io/name: prometheus
    toPorts:
    - ports:
      - protocol: TCP
        port: '8000'
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: TCP
      - port: '53'
        protocol: UDP
      rules:
        dns:
        - matchName: cluster.local
        - matchName: svc.cluster.local
        - matchPattern: '**.svc.cluster.local'
        - matchPattern: '**.cluster.local'
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: noteverse-data
        k8s:app.kubernetes.io/name: postgresql
    toPorts:
    - ports:
      - protocol: TCP
        port: '5432'
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: noteverse-data
        k8s:app.kubernetes.io/name: redis
    toPorts:
    - ports:
      - protocol: TCP
        port: '6379'
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: observability
        k8s:app.kubernetes.io/name: opentelemetry-collector
        k8s:app.kubernetes.io/instance: otel-collector
    toPorts:
    - ports:
      - protocol: TCP
        port: '4317'
---
