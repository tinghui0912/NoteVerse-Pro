apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: noteverse-tls
  labels:
    app.kubernetes.io/component: tls
spec:
  secretName: noteverse-staging-tls
  dnsNames:
    - staging.johnabc.ccwu.cc
    - admin.staging.johnabc.ccwu.cc
  issuerRef:
    name: letsencrypt-production-dns01
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: noteverse
  labels:
    app.kubernetes.io/component: gateway
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: web-https
      hostname: staging.johnabc.ccwu.cc
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: noteverse-staging-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: admin-https
      hostname: admin.staging.johnabc.ccwu.cc
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: noteverse-staging-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: noteverse-web
  labels:
    app.kubernetes.io/component: routing
spec:
  parentRefs:
    - name: noteverse
      sectionName: web-https
  hostnames:
    - staging.johnabc.ccwu.cc
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/realtime/events
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: noteverse-backend-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/practice
      backendRefs:
        - name: noteverse-backend-practice
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: noteverse-backend-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: noteverse-frontend
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: noteverse-platform-admin
  labels:
    app.kubernetes.io/component: routing
spec:
  parentRefs:
    - name: noteverse
      sectionName: admin-https
  hostnames:
    - admin.staging.johnabc.ccwu.cc
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: noteverse-platform-admin
          port: 3000
