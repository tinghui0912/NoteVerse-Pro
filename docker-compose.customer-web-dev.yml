name: noteverse-customer-web-dev

services:
  customer-web:
    image: noteverse-customer-web-runtime:dev
    build:
      context: .
      dockerfile: docker/customer-web/Dockerfile.dev
    env_file:
      - path: apps/customer-web/.env.docker
        required: true
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    volumes:
      - ./apps/customer-web:/app
      - noteverse_customer_web_node_modules:/app/node_modules
    tmpfs:
      - /app/.next
    ports:
      - "${CUSTOMER_WEB_PORT:-9002}:9002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  noteverse_customer_web_node_modules:
