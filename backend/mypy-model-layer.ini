[mypy]
python_version = 3.10
plugins = sqlalchemy.ext.mypy.plugin
files = app/api/deps.py, app/db/__init__.py, app/db/model_utils.py, app/db/models, app/utils/permissions.py, app/modules/auth/dependencies.py, app/modules/auth/router.py, app/modules/auth/schemas.py, app/modules/auth/service.py, app/modules/files/dependencies.py, app/modules/files/render_service.py, app/modules/files/repository.py, app/modules/files/router.py, app/modules/files/service.py, app/modules/profile/dependencies.py, app/modules/profile/router.py, app/modules/profile/service.py, app/modules/shares/access_service.py, app/modules/shares/collection_service.py, app/modules/shares/dependencies.py, app/modules/shares/repository.py, app/modules/shares/router.py, app/modules/shares/service.py, app/modules/tasks/archive_service.py, app/modules/tasks/dependencies.py, app/modules/tasks/repository.py, app/modules/tasks/router.py, app/modules/tasks/schemas.py, app/modules/tasks/service.py, app/modules/tasks/submission_service.py, app/modules/tasks/worker_repository.py, app/modules/tasks/worker_service.py, app/modules/xml/dependencies.py, app/modules/xml/render_service.py, app/modules/xml/router.py, app/modules/xml/service.py
exclude = (^alembic/|^data/)
ignore_missing_imports = true
follow_imports = skip
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
