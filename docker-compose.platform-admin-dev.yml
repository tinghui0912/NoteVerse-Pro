name: noteverse-platform-admin-dev

services:
  platform-admin:
    image: noteverse-platform-admin-dev:dev
    build:
      context: .
      dockerfile: docker/platform-admin/Dockerfile.dev
    env_file:
      - path: apps/platform-admin/.env.docker
        required: true
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    volumes:
      - ./apps/platform-admin:/app
      - noteverse_platform_admin_node_modules:/app/node_modules
    tmpfs:
      - /app/.next
    ports:
      - "${PLATFORM_ADMIN_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  noteverse_platform_admin_node_modules:
