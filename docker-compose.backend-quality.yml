name: noteverse-backend-quality

services:
  quality-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: noteverse
      POSTGRES_PASSWORD: noteverse
      POSTGRES_DB: noteverse_test_quality
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteverse -d noteverse_test_quality"]
      interval: 2s
      timeout: 3s
      retries: 30
  quality:
    working_dir: /repo/backend
    environment:
      PYTHONPATH: /repo/backend
      NOTEVERSE_REPO_ROOT: /repo
      AUTH_COOKIE_SECURE: "false"
      FRONTEND_BASE_URL: http://localhost:3000
      BACKEND_CORS_ORIGINS: '[]'
      TRUSTED_PROXY_CIDRS: '[]'
      LOG_FORMAT: json
      REDIS_URL: redis://127.0.0.1:1/0
      CELERY_BROKER_URL: redis://127.0.0.1:1/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:1/2
      S3_ENDPOINT_URL: https://storage.example.test
      S3_BUCKET: quality
      S3_ACCESS_KEY_ID: quality
      S3_SECRET_ACCESS_KEY: quality
      REALTIME_EVENT_CLEANUP_INTERVAL_SECONDS: "60"
      REALTIME_EVENT_RETENTION_DAYS: "7"
      WORK_ROOT: /tmp/noteverse-quality/work
      OPERATOR_TOTP_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      CONTROL_PLANE_COOKIE_SECURE: "false"
      CONTROL_PLANE_CORS_ORIGINS: '["http://localhost:3001"]'
      DATABASE_URL: postgresql+psycopg://noteverse:noteverse@quality-postgres:5432/noteverse_test_quality
      SCHEDULER_LOCK_DATABASE_URL: postgresql+psycopg://noteverse:noteverse@quality-postgres:5432/noteverse_test_quality
      NOTEVERSE_TEST_PRACTICE_BUNDLE_POSTGRES_URL: postgresql+psycopg://noteverse:noteverse@quality-postgres:5432/noteverse_test_quality
      PLAYBACK_SOUNDFONT_PATH: /usr/share/sounds/sf2/FluidR3_GM.sf2
      LEGATO_REPO_PATH: /opt/noteverse/legato
    volumes:
      - ./:/repo:ro
      - ./backend:/repo/backend
    depends_on:
      quality-postgres:
        condition: service_healthy
    image: noteverse-backend-quality:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.quality
    entrypoint: []
    command: bash
    restart: "no"
