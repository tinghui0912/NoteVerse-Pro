name: noteverse-integration

x-backend-integration: &backend-integration
  image: noteverse-backend-api:integration
  build:
    context: .
    dockerfile: docker/backend/Dockerfile.api
  env_file:
    - path: backend/.env.docker
      required: true
  environment:
    DATABASE_URL: postgresql+psycopg://noteverse:noteverse@postgres:5432/noteverse_integration
    REDIS_URL: redis://redis:6379/0
    DEBUG: "false"
    FRONTEND_BASE_URL: http://customer-web:3000
    BACKEND_CORS_ORIGINS: '["http://localhost:3010"]'
    AUTH_COOKIE_SECURE: "false"
    AUTH_COOKIE_SAMESITE: lax

services:
  postgres:
    image: postgres:16.12-bookworm
    environment:
      POSTGRES_DB: noteverse_integration
      POSTGRES_USER: noteverse
      POSTGRES_PASSWORD: noteverse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteverse -d noteverse_integration"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - integration_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend-integration
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *backend-integration
    command: python scripts/seed_integration_user.py
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend-integration
    command: api
    ports:
      - "3011:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20

  customer-web:
    image: noteverse-customer-web-integration:dev
    build:
      context: .
      dockerfile: docker/customer-web/Dockerfile.dev
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_BACKEND_ORIGIN: http://api:8000
      NEXT_PRACTICE_ORIGIN: http://practice:8000
      NEXT_ALLOWED_DEV_ORIGINS: http://localhost:3010
      AUTH_COOKIE_NAME: noteverse_session
      REFRESH_COOKIE_NAME: noteverse_refresh
    volumes:
      - ./apps/customer-web:/app
      - integration_customer_web_node_modules:/app/node_modules
    tmpfs:
      - /app/.next
    ports:
      - "3010:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  integration_postgres:
  integration_customer_web_node_modules:
