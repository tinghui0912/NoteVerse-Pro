name: noteverse-integration
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: noteverse
      POSTGRES_PASSWORD: noteverse
      POSTGRES_DB: noteverse_test_integration
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U noteverse -d noteverse_test_integration
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
    - integration_database:/var/lib/postgresql/data
  redis:
    image: redis:8
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: noteverse-backend-api:integration
    volumes:
    - integration_work:/tmp/noteverse-integration
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql+psycopg://nv_migrator:${NV_MIGRATOR_PASSWORD:?Runtime database password is required}@postgres:5432/noteverse_test_integration
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.api
  seed:
    image: noteverse-backend-api:integration
    volumes:
    - integration_work:/tmp/noteverse-integration
    extra_hosts:
    - host.docker.internal:host-gateway
    command: python scripts/seed_integration_user.py
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
    env_file:
    - path: backend/.env.docker.customer-api
      required: true
    environment:
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg://nv_customer_api:${NV_CUSTOMER_API_PASSWORD:?Runtime database password is required}@postgres:5432/noteverse_test_integration
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WORK_ROOT: /tmp/noteverse-integration/work
      DEBUG: 'false'
      FRONTEND_BASE_URL: http://localhost:3000
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
      AUTH_COOKIE_SECURE: 'false'
      UPLOAD_URL_TTL_SECONDS: '120'
      UPLOAD_SESSION_TTL_SECONDS: '600'
      NOTEVERSE_INTEGRATION_RUN_ID: ${NOTEVERSE_INTEGRATION_RUN_ID:?Integration run identity is required}
      NOTEVERSE_INTEGRATION_PASSWORD: ${NOTEVERSE_INTEGRATION_PASSWORD:?Integration password is required}
  api:
    image: noteverse-backend-api:integration
    volumes:
    - integration_work:/tmp/noteverse-integration
    extra_hosts:
    - host.docker.internal:host-gateway
    command: api
    ports:
    - 3011:8000
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)
      interval: 5s
      timeout: 3s
      retries: 20
    env_file:
    - path: backend/.env.docker.customer-api
      required: true
    environment:
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg://nv_customer_api:${NV_CUSTOMER_API_PASSWORD:?Runtime database password is required}@postgres:5432/noteverse_test_integration
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WORK_ROOT: /tmp/noteverse-integration/work
      DEBUG: 'false'
      FRONTEND_BASE_URL: http://localhost:3000
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
      AUTH_COOKIE_SECURE: 'false'
      UPLOAD_URL_TTL_SECONDS: '120'
      UPLOAD_SESSION_TTL_SECONDS: '600'
      NOTEVERSE_INTEGRATION_RUN_ID: ${NOTEVERSE_INTEGRATION_RUN_ID:?Integration run identity is required}
      NOTEVERSE_INTEGRATION_PASSWORD: ${NOTEVERSE_INTEGRATION_PASSWORD:?Integration password is required}
  worker:
    image: noteverse-backend-worker:integration
    volumes:
    - integration_work:/tmp/noteverse-integration
    extra_hosts:
    - host.docker.internal:host-gateway
    command: worker
    depends_on:
      seed:
        condition: service_completed_successfully
    env_file:
    - path: backend/.env.docker.worker
      required: true
    environment:
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg://nv_worker:${NV_WORKER_PASSWORD:?Runtime database password is required}@postgres:5432/noteverse_test_integration
      SCHEDULER_LOCK_DATABASE_URL: postgresql+psycopg://nv_worker:${NV_WORKER_PASSWORD:?Runtime database password is required}@postgres:5432/noteverse_test_integration
      REALTIME_EVENT_CLEANUP_INTERVAL_SECONDS: '60'
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WORK_ROOT: /tmp/noteverse-integration/work
      REALTIME_EVENT_RETENTION_DAYS: '7'
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.worker
      args:
        WORKER_DEPS_IMAGE: ${WORKER_DEPS_IMAGE:-noteverse-backend-worker-deps:dev}
  beat:
    image: noteverse-backend-beat:integration
    volumes:
    - integration_work:/tmp/noteverse-integration
    extra_hosts:
    - host.docker.internal:host-gateway
    command: beat
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg://nv_beat:${NV_BEAT_PASSWORD:?Runtime database password is required}@postgres:5432/noteverse_test_integration
      SCHEDULER_LOCK_DATABASE_URL: postgresql+psycopg://nv_beat:${NV_BEAT_PASSWORD:?Runtime database password is required}@postgres:5432/noteverse_test_integration
      REALTIME_EVENT_CLEANUP_INTERVAL_SECONDS: '60'
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WORK_ROOT: /tmp/noteverse-integration/work
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.beat
  customer-web:
    image: noteverse-customer-web-integration:dev
    build:
      context: .
      dockerfile: docker/customer-web/Dockerfile.dev
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_BACKEND_ORIGIN: http://api:8000
      NEXT_ALLOWED_DEV_ORIGINS: http://localhost:3000
    volumes:
    - ./apps/customer-web:/app
    - integration_customer_web_node_modules:/app/node_modules
    tmpfs:
    - /app/.next
    ports:
    - 3000:3000
    depends_on:
      api:
        condition: service_healthy
  bootstrap:
    image: noteverse-backend-api:integration
    volumes:
    - integration_work:/tmp/noteverse-integration
    extra_hosts:
    - host.docker.internal:host-gateway
    command:
    - python
    - scripts/provision_database.py
    - bootstrap
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NOTEVERSE_DB_ADMIN_URL: postgresql+psycopg://noteverse:noteverse@postgres:5432/noteverse_test_integration
      NV_MIGRATOR_PASSWORD: ${NV_MIGRATOR_PASSWORD:?Runtime database password is required}
      NV_CUSTOMER_API_PASSWORD: ${NV_CUSTOMER_API_PASSWORD:?Runtime database password is required}
      NV_CONTROL_PLANE_PASSWORD: ${NV_CONTROL_PLANE_PASSWORD:?Runtime database password is required}
      NV_WORKER_PASSWORD: ${NV_WORKER_PASSWORD:?Runtime database password is required}
      NV_BEAT_PASSWORD: ${NV_BEAT_PASSWORD:?Runtime database password is required}
      NV_OBSERVABILITY_PASSWORD: ${NV_OBSERVABILITY_PASSWORD:?Runtime database password is required}
volumes:
  integration_customer_web_node_modules: null
  integration_work: null
  integration_database: null
