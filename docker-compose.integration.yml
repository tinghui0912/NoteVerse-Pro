name: noteverse-integration

x-backend-integration: &backend-integration
  image: noteverse-backend-api:integration
  build:
    context: .
    dockerfile: docker/backend/Dockerfile.api
  env_file:
    - path: backend/.env.docker
      required: true
  environment:
    DEBUG: "false"
    FRONTEND_BASE_URL: http://customer-web:3000
    BACKEND_CORS_ORIGINS: '["http://localhost:3010"]'
    AUTH_COOKIE_SECURE: "false"
    AUTH_COOKIE_SAMESITE: lax
    WORK_ROOT: /tmp/noteverse-integration/work
    S3_ENDPOINT_URL: http://object-store:9000
    S3_SIGNED_ENDPOINT_URL: http://localhost:9011
    S3_BUCKET: noteverse-integration
    S3_ACCESS_KEY_ID: noteverse-integration
    S3_SECRET_ACCESS_KEY: noteverse-integration-secret
    S3_FORCE_PATH_STYLE: "true"
  volumes:
    - integration_work:/tmp/noteverse-integration
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: noteverse-integration
      MINIO_ROOT_PASSWORD: noteverse-integration-secret
    ports:
      - "9011:9000"
    volumes:
      - integration_objects:/data
  object-store-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - object-store
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set integration http://object-store:9000 noteverse-integration noteverse-integration-secret; do sleep 1; done
        mc mb --ignore-existing integration/noteverse-integration
    restart: "no"
  migrate:
    <<: *backend-integration
    depends_on:
      object-store-init:
        condition: service_completed_successfully
    command: migrate
    restart: "no"

  seed:
    <<: *backend-integration
    command: python scripts/seed_integration_user.py
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend-integration
    command: api
    ports:
      - "3011:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend-integration
    env_file:
      - path: backend/.env.docker
        required: true
      - path: backend/.env.docker.worker
        required: true
    image: noteverse-backend-worker:integration
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.worker
      args:
        WORKER_DEPS_IMAGE: ${WORKER_DEPS_IMAGE:-noteverse-backend-worker-deps:dev}
    command: worker
    depends_on:
      seed:
        condition: service_completed_successfully

  beat:
    <<: *backend-integration
    image: noteverse-backend-beat:integration
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.beat
    command: beat
    depends_on:
      seed:
        condition: service_completed_successfully

  customer-web:
    image: noteverse-customer-web-integration:dev
    build:
      context: .
      dockerfile: docker/customer-web/Dockerfile.dev
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_BACKEND_ORIGIN: http://api:8000
      NEXT_ALLOWED_DEV_ORIGINS: http://localhost:3010
      AUTH_COOKIE_NAME: noteverse_session
      REFRESH_COOKIE_NAME: noteverse_refresh
    volumes:
      - ./apps/customer-web:/app
      - integration_customer_web_node_modules:/app/node_modules
    tmpfs:
      - /app/.next
    ports:
      - "3010:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  integration_customer_web_node_modules:
  integration_work:
  integration_objects:
