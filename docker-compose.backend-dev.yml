name: noteverse-backend-dev

x-backend-common: &backend-common
  env_file:
    - path: backend/.env.docker
      required: true
  environment:
    PYTHONPATH: /app
    UVICORN_RELOAD: "true"
    S3_ENDPOINT_URL: http://object-store:9000
    S3_SIGNED_ENDPOINT_URL: http://localhost:9010
    S3_BUCKET: noteverse-dev
    S3_ACCESS_KEY_ID: noteverse-dev
    S3_SECRET_ACCESS_KEY: noteverse-dev-secret
    S3_FORCE_PATH_STYLE: "true"
  entrypoint:
    - /usr/bin/tini
    - --
    - /bin/bash
    - /docker/entrypoint.sh
  volumes:
    - ./backend:/app
    - ./docker/backend/entrypoint.sh:/docker/entrypoint.sh:ro
    - ${NOTEVERSE_MODEL_ROOT:-./models}:/opt/noteverse/models:ro
    - ./backend/data:/app/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  depends_on:
    object-store-init:
      condition: service_completed_successfully

services:
  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: noteverse-dev
      MINIO_ROOT_PASSWORD: noteverse-dev-secret
    ports:
      - "9010:9000"
    volumes:
      - durable_objects:/data
  object-store-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - object-store
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set dev http://object-store:9000 noteverse-dev noteverse-dev-secret; do sleep 1; done
        mc mb --ignore-existing dev/noteverse-dev
    restart: "no"
  api:
    <<: *backend-common
    image: noteverse-backend-api:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.api
    command: api
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  control:
    <<: *backend-common
    env_file:
      - path: backend/.env.docker
        required: true
      - path: backend/.env.docker.control-plane
        required: true
    image: noteverse-backend-api:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.api
    command: control
    profiles:
      - control-plane
    ports:
      - "${CONTROL_PLANE_PORT:-8002}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *backend-common
    env_file:
      - path: backend/.env.docker
        required: true
      - path: backend/.env.docker.worker
        required: true
    image: noteverse-backend-worker:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.worker
      args:
        WORKER_DEPS_IMAGE: ${WORKER_DEPS_IMAGE:-noteverse-backend-worker-deps:dev}
    command: worker
    gpus: all

  worker-deps:
    image: noteverse-backend-worker-deps:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.worker-deps
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    entrypoint: []
    command: bash
    restart: "no"
  beat:
    <<: *backend-common
    image: noteverse-backend-beat:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.beat
    command: beat

  quality:
    <<: *backend-common
    environment:
      PYTHONPATH: /app
      NOTEVERSE_REPO_ROOT: /repo
      S3_ENDPOINT_URL: http://object-store:9000
      S3_SIGNED_ENDPOINT_URL: http://localhost:9010
      S3_BUCKET: noteverse-dev
      S3_ACCESS_KEY_ID: noteverse-dev
      S3_SECRET_ACCESS_KEY: noteverse-dev-secret
    volumes:
      - ./backend:/app
      - ./:/repo:ro
    env_file:
      - path: backend/.env.docker
        required: true
      - path: backend/.env.docker.worker
        required: true
    image: noteverse-backend-quality:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.quality
    entrypoint: []
    command: bash
    restart: "no"

volumes:
  durable_objects:
