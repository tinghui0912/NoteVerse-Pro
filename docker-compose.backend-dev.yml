name: noteverse-backend-dev

x-backend-common: &backend-common
  image: noteverse-backend-runtime:dev
  env_file:
    - path: backend/.env.docker
      required: true
  environment:
    PYTHONPATH: /app
    UVICORN_RELOAD: "true"
  entrypoint:
    - /usr/bin/tini
    - --
    - /bin/bash
    - /docker/entrypoint.sh
  volumes:
    - ./backend:/app
    - ./docker/backend/entrypoint.sh:/docker/entrypoint.sh:ro
    - ./external/legato:/external/legato:ro
    - ${NOTEVERSE_MODEL_ROOT:-./models}:/opt/noteverse/models:ro
    - ./backend/data:/app/data
    - ./backend/logs:/app/logs
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  api:
    <<: *backend-common
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-noteverse-ml-base:py312-torch260-cu124}
        INSTALL_DEV_DEPS: ${INSTALL_DEV_DEPS:-true}
        INSTALL_GPU_DEPS: ${INSTALL_GPU_DEPS:-true}
        INSTALL_PADDLE_GPU: ${INSTALL_PADDLE_GPU:-false}
        INSTALL_LEGATO_EXTRA_DEPS: ${INSTALL_LEGATO_EXTRA_DEPS:-false}
        PADDLE_CUDA_INDEX: ${PADDLE_CUDA_INDEX:-cu126}
    command: api
    gpus: all
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *backend-common
    command: worker
    gpus: all

  beat:
    <<: *backend-common
    command: beat
