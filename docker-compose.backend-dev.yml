name: noteverse-backend-dev

x-backend-common: &backend-common
  env_file:
    - path: backend/.env.docker
      required: true
  environment:
    PYTHONPATH: /app
    UVICORN_RELOAD: "true"
  entrypoint:
    - /usr/bin/tini
    - --
    - /bin/bash
    - /docker/entrypoint.sh
  volumes:
    - ./backend:/app
    - ./docker/backend/entrypoint.sh:/docker/entrypoint.sh:ro
    - ${NOTEVERSE_MODEL_ROOT:-./models}:/opt/noteverse/models:ro
    - ./backend/data:/app/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  api:
    <<: *backend-common
    image: noteverse-backend-api:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.api
    command: api
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  control:
    <<: *backend-common
    env_file:
      - path: backend/.env.docker
        required: true
      - path: backend/.env.docker.control-plane
        required: true
    image: noteverse-backend-api:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.api
    command: control
    profiles:
      - control-plane
    ports:
      - "${CONTROL_PLANE_PORT:-8002}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  practice:
    <<: *backend-common
    env_file:
      - path: backend/.env.docker
        required: true
      - path: backend/.env.docker.practice
        required: true
    image: noteverse-backend-practice:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.practice
      args:
        PRACTICE_DEPS_IMAGE: noteverse-backend-practice-deps:dev
    command: practice
    ports:
      - "${PRACTICE_PORT:-8001}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  practice-deps:
    image: noteverse-backend-practice-deps:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.practice-deps
    entrypoint: []
    command: bash
    restart: "no"

  worker:
    <<: *backend-common
    env_file:
      - path: backend/.env.docker
        required: true
      - path: backend/.env.docker.worker
        required: true
    image: noteverse-backend-worker:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.worker
      args:
        WORKER_DEPS_IMAGE: ${WORKER_DEPS_IMAGE:-noteverse-backend-worker-deps:dev}
    command: worker
    gpus: all

  worker-deps:
    image: noteverse-backend-worker-deps:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.worker-deps
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-ghcr.io/tinghui0912/noteverse/ml-base:py312-torch260-cu124}
        INSTALL_PADDLE_GPU: ${INSTALL_PADDLE_GPU:-false}
        INSTALL_LEGATO_EXTRA_DEPS: ${INSTALL_LEGATO_EXTRA_DEPS:-false}
        PADDLE_CUDA_INDEX: ${PADDLE_CUDA_INDEX:-cu126}
        LEGATO_REPO_URL: ${LEGATO_REPO_URL:-https://github.com/guang-yng/legato.git}
        LEGATO_REPO_COMMIT: ${LEGATO_REPO_COMMIT:-179c228d3d5f67113cf739b44891b3abe046f1dc}
    entrypoint: []
    command: bash
    restart: "no"

  beat:
    <<: *backend-common
    image: noteverse-backend-beat:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.beat
    command: beat

  quality:
    <<: *backend-common
    env_file:
      - path: backend/.env.docker
        required: true
      - path: backend/.env.docker.worker
        required: true
    image: noteverse-backend-quality:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.quality
    entrypoint: []
    command: bash
    restart: "no"

  practice-quality:
    <<: *backend-common
    env_file:
      - path: backend/.env.docker
        required: true
      - path: backend/.env.docker.practice
        required: true
    image: noteverse-backend-practice-quality:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.practice-quality
      args:
        PRACTICE_DEPS_IMAGE: noteverse-backend-practice-deps:dev
    entrypoint: []
    command: bash
    restart: "no"
