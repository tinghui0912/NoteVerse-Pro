name: noteverse-backend-dev

x-backend-common: &backend-common
  environment:
    PYTHONPATH: /app
    UVICORN_RELOAD: "true"
  entrypoint:
    - /usr/bin/tini
    - --
    - /bin/bash
    - /docker/entrypoint.sh
  volumes:
    - ./backend:/app
    - ./docker/backend/entrypoint.sh:/docker/entrypoint.sh:ro
    - ./docker/backend/worker-entrypoint.sh:/docker/worker-entrypoint.sh:ro
    - ${NOTEVERSE_MODEL_ROOT:-./models}:/opt/noteverse/models:ro
    - ./backend/data:/app/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  api:
    <<: *backend-common
    env_file:
      - path: backend/.env.docker.customer-api
        required: true
    image: noteverse-backend-core:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.core
    command: customer-api
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  control:
    <<: *backend-common
    env_file:
      - path: backend/.env.docker.control-plane
        required: true
    image: noteverse-backend-core:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.core
    command: control-plane
    profiles:
      - control-plane
    ports:
      - "${CONTROL_PLANE_PORT:-8002}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *backend-common
    entrypoint: ["/usr/bin/tini", "--", "/bin/bash", "/docker/worker-entrypoint.sh"]
    env_file:
      - path: backend/.env.docker.worker
        required: true
    image: noteverse-backend-worker:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.worker
      args:
        WORKER_DEPS_IMAGE: ${WORKER_DEPS_IMAGE:-noteverse-backend-worker-deps:dev}
    command: worker
    gpus: all

  worker-deps:
    image: noteverse-backend-worker-deps:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.worker-deps
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    entrypoint: []
    command: bash
    restart: "no"
  beat:
    <<: *backend-common
    env_file:
      - path: backend/.env.docker.beat
        required: true
    image: noteverse-backend-core:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.core
    command: beat

  migrate:
    <<: *backend-common
    image: noteverse-backend-core:dev
    env_file:
      - path: backend/.env.docker.migrator
        required: true
    command: migrator
    profiles: [tools]
    restart: "no"
