name: noteverse-backend-dev

x-backend-common: &backend-common
  env_file:
    - path: backend/.env.docker
      required: true
  environment:
    PYTHONPATH: /app
    UVICORN_RELOAD: "true"
  entrypoint:
    - /usr/bin/tini
    - --
    - /bin/bash
    - /docker/entrypoint.sh
  volumes:
    - ./backend:/app
    - ./docker/backend/entrypoint.sh:/docker/entrypoint.sh:ro
    - ${NOTEVERSE_MODEL_ROOT:-./models}:/opt/noteverse/models:ro
    - ./backend/data:/app/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  api:
    <<: *backend-common
    image: noteverse-backend-api:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.api
    command: api
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  control:
    <<: *backend-common
    env_file:
      - path: backend/.env.docker
        required: true
      - path: backend/.env.docker.control-plane
        required: true
    image: noteverse-backend-api:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.api
    command: control
    profiles:
      - control-plane
    ports:
      - "${CONTROL_PLANE_PORT:-8002}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *backend-common
    env_file:
      - path: backend/.env.docker
        required: true
      - path: backend/.env.docker.worker
        required: true
    image: noteverse-backend-worker:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.worker
      args:
        WORKER_DEPS_IMAGE: ${WORKER_DEPS_IMAGE:-noteverse-backend-worker-deps:dev}
    command: worker
    gpus: all

  worker-deps:
    image: noteverse-backend-worker-deps:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.worker-deps
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    entrypoint: []
    command: bash
    restart: "no"
  beat:
    <<: *backend-common
    image: noteverse-backend-beat:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.beat
    command: beat

  quality-postgres:
    image: postgres:17
    profiles: [quality]
    environment:
      POSTGRES_USER: noteverse
      POSTGRES_PASSWORD: noteverse
      POSTGRES_DB: noteverse_test_quality
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteverse -d noteverse_test_quality"]
      interval: 2s
      timeout: 3s
      retries: 30
  quality:
    profiles: [quality]
    <<: *backend-common
    working_dir: /repo/backend
    environment:
      PYTHONPATH: /repo/backend
      NOTEVERSE_REPO_ROOT: /repo
      CONTROL_PLANE_COOKIE_SECURE: "false"
      CONTROL_PLANE_COOKIE_SAMESITE: lax
      CONTROL_PLANE_SESSION_EXPIRE_MINUTES: "30"
      CONTROL_PLANE_CORS_ORIGINS: '["http://localhost:3001"]'
      DATABASE_URL: postgresql+psycopg://noteverse:noteverse@quality-postgres:5432/noteverse_test_quality
      SCHEDULER_LOCK_DATABASE_URL: postgresql+psycopg://noteverse:noteverse@quality-postgres:5432/noteverse_test_quality
      NOTEVERSE_TEST_PRACTICE_BUNDLE_POSTGRES_URL: postgresql+psycopg://noteverse:noteverse@quality-postgres:5432/noteverse_test_quality
      PLAYBACK_SOUNDFONT_PATH: /usr/share/sounds/sf2/FluidR3_GM.sf2
      LEGATO_REPO_PATH: /opt/noteverse/legato
    volumes:
      - ./:/repo:ro
      - ./backend:/repo/backend
    env_file:
      - path: backend/.env.docker
        required: true
      - path: backend/.env.docker.worker
        required: true
    depends_on:
      quality-postgres:
        condition: service_healthy
    image: noteverse-backend-quality:dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.quality
    entrypoint: []
    command: bash
    restart: "no"
