name: Backend Practice Image

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "docker/backend/Dockerfile.practice"
      - "docker/backend/Dockerfile.practice-deps"
      - "docker/backend/entrypoint.sh"
      - ".github/workflows/backend-practice-image.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker/backend/Dockerfile.practice"
      - "docker/backend/Dockerfile.practice-deps"
      - "docker/backend/entrypoint.sh"
      - ".github/workflows/backend-practice-image.yml"

concurrency:
  group: backend-practice-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH_IMAGE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      PUSH_DEPENDENCY_IMAGE: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/noteverse" >> "$GITHUB_ENV"

      - name: Resolve practice dependency image
        run: |
          PRACTICE_DEPS_HASH="$(
            sha256sum \
              docker/backend/Dockerfile.practice-deps \
              backend/requirements/practice-app.txt \
              backend/requirements/practice-runtime.txt \
              backend/requirements/practice-runtime-constraints.txt \
            | sha256sum \
            | cut -c1-16
          )"
          echo "PRACTICE_DEPS_HASH=${PRACTICE_DEPS_HASH}" >> "$GITHUB_ENV"
          echo "PRACTICE_DEPS_IMAGE=${IMAGE_NAMESPACE}/backend-practice-deps:deps-${PRACTICE_DEPS_HASH}" >> "$GITHUB_ENV"

      - name: Check practice dependency changes
        run: |
          set -euo pipefail
          PRACTICE_DEPS_CHANGED=false

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PRACTICE_DEPS_CHANGED=true
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${BASE_REF}"
            if ! git diff --quiet "origin/${BASE_REF}...HEAD" -- \
              docker/backend/Dockerfile.practice-deps \
              backend/requirements/practice-app.txt \
              backend/requirements/practice-runtime.txt \
              backend/requirements/practice-runtime-constraints.txt; then
              PRACTICE_DEPS_CHANGED=true
            fi
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              PRACTICE_DEPS_CHANGED=true
            elif ! git diff --quiet "${BEFORE_SHA}...HEAD" -- \
              docker/backend/Dockerfile.practice-deps \
              backend/requirements/practice-app.txt \
              backend/requirements/practice-runtime.txt \
              backend/requirements/practice-runtime-constraints.txt; then
              PRACTICE_DEPS_CHANGED=true
            fi
          fi

          echo "PRACTICE_DEPS_CHANGED=${PRACTICE_DEPS_CHANGED}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build backend practice dependency image
        if: env.PRACTICE_DEPS_CHANGED == 'true'
        run: |
          docker build \
            -f docker/backend/Dockerfile.practice-deps \
            -t "${PRACTICE_DEPS_IMAGE}" \
            -t "${IMAGE_NAMESPACE}/backend-practice-deps:build-${GITHUB_RUN_ID}" \
            .
          if [ "${PUSH_DEPENDENCY_IMAGE}" = "true" ]; then
            docker push "${PRACTICE_DEPS_IMAGE}"
            docker push "${IMAGE_NAMESPACE}/backend-practice-deps:build-${GITHUB_RUN_ID}"
          fi

      - name: Pull backend practice dependency image
        if: env.PRACTICE_DEPS_CHANGED != 'true'
        run: |
          docker pull "${PRACTICE_DEPS_IMAGE}" || {
            echo "::error::Missing ${PRACTICE_DEPS_IMAGE}. Run this workflow manually after practice dependency changes, or publish the matching backend-practice-deps image first."
            exit 1
          }

      - name: Build backend practice runtime image
        run: |
          docker build \
            -f docker/backend/Dockerfile.practice \
            --build-arg "PRACTICE_DEPS_IMAGE=${PRACTICE_DEPS_IMAGE}" \
            -t "${IMAGE_NAMESPACE}/backend-practice:${GITHUB_SHA}" \
            -t "${IMAGE_NAMESPACE}/backend-practice:build-${GITHUB_RUN_ID}" \
            .
          if [ "${PUSH_IMAGE}" = "true" ]; then
            docker push "${IMAGE_NAMESPACE}/backend-practice:${GITHUB_SHA}"
            docker push "${IMAGE_NAMESPACE}/backend-practice:build-${GITHUB_RUN_ID}"
          fi

      - name: Generate backend practice SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/backend-practice:${{ github.sha }}
          format: spdx-json
          artifact-name: backend-practice-image-sbom.spdx.json

      - name: Scan backend practice image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/backend-practice:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Write image build summary
        run: |
          {
            echo "## Backend practice image build"
            echo ""
            echo "- Push image: \`${PUSH_IMAGE}\`"
            echo "- Backend practice deps image: \`${PRACTICE_DEPS_IMAGE}\`"
            echo "- Backend practice deps changed: \`${PRACTICE_DEPS_CHANGED}\`"
            echo "- Backend practice image: \`${IMAGE_NAMESPACE}/backend-practice:${GITHUB_SHA}\`"
            echo "- SBOM artifact: backend-practice-image-sbom.spdx.json"
            echo "- Vulnerability gate: CRITICAL, ignore unfixed"
          } >> "$GITHUB_STEP_SUMMARY"
