name: Backend Worker PR Image

on:
  pull_request:
    paths:
      - "backend/**"
      - "!backend/research/**"
      - "docker/backend/Dockerfile.worker"
      - "docker/backend/Dockerfile.worker.dockerignore"
      - "docker/backend/Dockerfile.worker-deps"
      - "docker/backend/Dockerfile.worker-deps.dockerignore"
      - "docker/backend/entrypoint.sh"
      - ".github/workflows/backend-worker-image.yml"
      - ".github/workflows/backend-worker-pr-image.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: backend-worker-pr-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PUSH_IMAGE: "false"
      ML_BASE_TAG: py312-torch260-cu124-slim
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve local image and recursive dependency identities
        run: |
          set -euo pipefail
          IMAGE_NAMESPACE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/noteverse"
          ML_BASE_IMAGE="${IMAGE_NAMESPACE}/ml-base:${ML_BASE_TAG}"
          WORKER_REQUIREMENTS_HASH="$(python3 backend/scripts/worker_requirements_fingerprint.py)"
          WORKER_DEPS_HASH="$(
            {
              printf 'worker-requirements-sha256:%s\n' "${WORKER_REQUIREMENTS_HASH}"
              sha256sum \
                docker/backend/Dockerfile.worker-deps \
                backend/scripts/worker_requirements_fingerprint.py \
                backend/app/processing/engines/omr/legato_manifest.py
              printf '%s\n' "${ML_BASE_IMAGE}"
              printf '%s\n' "INSTALL_PADDLE_GPU=false"
              printf '%s\n' "INSTALL_LEGATO_EXTRA_DEPS=false"
            } | sha256sum | cut -c1-16
          )"
          {
            echo "ML_BASE_IMAGE=${ML_BASE_IMAGE}"
            echo "WORKER_REQUIREMENTS_HASH=${WORKER_REQUIREMENTS_HASH}"
            echo "WORKER_DEPS_HASH=${WORKER_DEPS_HASH}"
            echo "WORKER_DEPS_IMAGE=${IMAGE_NAMESPACE}/backend-worker-deps:deps-${WORKER_DEPS_HASH}"
            echo "WORKER_IMAGE=${IMAGE_NAMESPACE}/backend-worker:${GITHUB_SHA}"
          } >> "$GITHUB_ENV"
      - name: Free hosted runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h
      - name: Log in to GHCR with the read-only job token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull existing ML Base (never rebuild or publish)
        run: |
          docker pull "$ML_BASE_IMAGE" || {
            echo "::error::Cannot read the configured existing ML Base. Check image existence and read access; this PR job cannot rebuild or publish it."
            exit 1
          }
      # The daemon builder can consume the locally built dependency image in
      # the next FROM; no registry publication is used as an intermediary.
      - name: Build Worker-deps locally without push
        run: |
          docker build --progress=plain -f docker/backend/Dockerfile.worker-deps \
            --build-arg "PYTHON_IMAGE=${ML_BASE_IMAGE}" \
            --build-arg INSTALL_PADDLE_GPU=false \
            --build-arg INSTALL_LEGATO_EXTRA_DEPS=false \
            -t "$WORKER_DEPS_IMAGE" .
      - name: Build final Worker locally without push
        run: |
          docker build --progress=plain -f docker/backend/Dockerfile.worker \
            --build-arg "WORKER_DEPS_IMAGE=${WORKER_DEPS_IMAGE}" \
            -t "$WORKER_IMAGE" .
      - name: Check final local Worker packaging contract offline
        run: docker run --rm --network none --entrypoint python "$WORKER_IMAGE" scripts/check_image_contract.py --role worker
      - name: Generate local Worker-deps SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.WORKER_DEPS_IMAGE }}
          format: spdx-json
          artifact-name: backend-worker-deps-image-sbom.spdx.json
      - name: Generate local Worker SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.WORKER_IMAGE }}
          format: spdx-json
          artifact-name: backend-worker-image-sbom.spdx.json
      - name: Scan local Worker-deps
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WORKER_DEPS_IMAGE }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Scan local Worker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WORKER_IMAGE }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Write PR validation summary
        run: |
          {
            echo "## Worker PR artifact validation"
            echo "- PUSH_IMAGE=false; dependency and final images built only in the runner daemon"
            echo "- Local Worker image: ${WORKER_IMAGE} (PR synthetic-merge source)"
            echo "- Requirements SHA-256: ${WORKER_REQUIREMENTS_HASH}"
            echo "- Dependency fingerprint: ${WORKER_DEPS_HASH}"
            echo "- Final packaging/import contract, SBOMs and CRITICAL scans passed"
            echo "- No ML Base rebuild, image publication, GPU or model-cache qualification"
          } >> "$GITHUB_STEP_SUMMARY"
