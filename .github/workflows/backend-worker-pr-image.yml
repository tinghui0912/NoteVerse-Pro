name: Backend Worker PR Image
'on':
  pull_request:
    paths:
    - backend/**
    - '!backend/research/**'
    - docker/backend/Dockerfile.worker
    - docker/backend/Dockerfile.worker.dockerignore
    - docker/backend/Dockerfile.worker-deps
    - docker/backend/Dockerfile.worker-deps.dockerignore
    - docker/backend/entrypoint.sh
    - .github/workflows/backend-worker-image.yml
    - .github/workflows/backend-worker-pr-image.yml
    - ".github/scripts/backend_*.py"
    - ".github/scripts/test_backend_*.py"
    - ".github/scripts/oci_publication.py"
    - ".github/scripts/test_oci_publication.py"
permissions:
  contents: read
concurrency:
  group: backend-worker-pr-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PUSH_IMAGE: 'false'
      DOCKER_BUILDKIT: '1'
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Resolve Worker namespace
      run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/noteverse" >> "$GITHUB_ENV"
    - name: Initial hosted runner disk boundary
      if: runner.environment == 'github-hosted'
      env:
        NOTEVERSE_EPHEMERAL_RUNNER: ${{ runner.environment }}
      run: python3 .github/scripts/backend_worker_runner_disk.py initial --builder docker
    - name: Resolve governed Python base to immutable OCI
      id: base
      run: python3 .github/scripts/backend_worker_image_publication.py --output "$GITHUB_OUTPUT" resolve-base
    - name: Select project Python for uv identity tooling
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version-file: backend/.python-version
    - name: Set up approved uv from project authority
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        version-file: backend/pyproject.toml
        enable-cache: false
        python-version: '3.12'
    - name: Check native uv lock
      run: cd backend && uv lock --check
    - name: Compute Worker dependency identity
      id: key
      env:
        BASE_DIGEST: ${{ steps.base.outputs.oci_digest }}
      run: python3 .github/scripts/backend_worker_image_identity.py --output "$GITHUB_OUTPUT" build-key --python-base-digest "$BASE_DIGEST"
    - name: Resolve unpublished local image names
      run: |-
        {
          echo "WORKER_DEPS_IMAGE=noteverse-worker-deps:pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "WORKER_IMAGE=noteverse-worker:pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        } >> "$GITHUB_ENV"
    - name: Build locked Worker-deps locally; never publish
      env:
        BASE_REF: ${{ steps.base.outputs.digest_ref }}
      run: |-
        docker build --platform linux/amd64 --progress=plain -f docker/backend/Dockerfile.worker-deps \
          --build-arg "PYTHON_IMAGE=$BASE_REF" \
          -t "$WORKER_DEPS_IMAGE" .
        echo "LOCAL_DEPS_ID=$(docker image inspect --format '{{.Id}}' "$WORKER_DEPS_IMAGE")" >> "$GITHUB_ENV"
    - name: Check deps final environment offline
      id: deps-contract
      env:
        DEPS_REF: ${{ env.WORKER_DEPS_IMAGE }}
      run: docker run --rm --network none --entrypoint python "$DEPS_REF" /usr/local/lib/noteverse/check_image_contract.py
        --role worker-deps
    - name: Release completed deps build cache and pulls
      env:
        DEPS_REF: ${{ env.WORKER_DEPS_IMAGE }}
        NOTEVERSE_EPHEMERAL_RUNNER: ${{ runner.environment }}
      run: python3 .github/scripts/backend_worker_runner_disk.py release --builder docker --image deps
    - name: Prepare bounded deps SBOM temporary space
      env:
        NOTEVERSE_EPHEMERAL_RUNNER: ${{ runner.environment }}
      run: python3 .github/scripts/backend_worker_runner_disk.py before-sbom --builder docker --image deps
    - name: Generate deps SPDX SBOM
      id: deps-sbom
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
      with:
        image: ${{ env.WORKER_DEPS_IMAGE }}
        format: spdx-json
        artifact-name: backend-worker-deps-image-sbom.spdx.json
      env:
        TMPDIR: ${{ runner.temp }}/noteverse-worker/deps-sbom/tmp
    - name: Remove completed deps SBOM temporary space
      if: always() && steps.deps-sbom.outcome != 'skipped'
      env:
        NOTEVERSE_EPHEMERAL_RUNNER: ${{ runner.environment }}
      run: python3 .github/scripts/backend_worker_runner_disk.py after-sbom --builder docker --image deps
    - name: Reclaim disk before deps vulnerability scan
      env:
        NOTEVERSE_EPHEMERAL_RUNNER: ${{ runner.environment }}
      run: python3 .github/scripts/backend_worker_runner_disk.py before-scan --builder docker --image deps
    - name: Scan deps exact artifact
      id: deps-scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ${{ env.WORKER_DEPS_IMAGE }}
        vuln-type: os,library
        severity: CRITICAL
        ignore-unfixed: true
        format: table
        exit-code: '1'
        timeout: 20m
        cache: false
      env:
        TMPDIR: ${{ runner.temp }}/noteverse-worker/deps-scan/tmp
        TRIVY_CACHE_DIR: ${{ runner.temp }}/noteverse-worker/deps-scan/cache
        TRIVY_IMAGE_SRC: docker
    - name: Remove completed deps scan export/cache
      if: always() && steps.deps-scan.outcome != 'skipped'
      env:
        NOTEVERSE_EPHEMERAL_RUNNER: ${{ runner.environment }}
      run: python3 .github/scripts/backend_worker_runner_disk.py after-scan --builder docker --image deps
    - name: Build final Worker from controlled local dependency image
      run: |-
        test "$(docker image inspect --format '{{.Id}}' "$WORKER_DEPS_IMAGE")" = "$LOCAL_DEPS_ID"
        docker build --platform linux/amd64 --progress=plain -f docker/backend/Dockerfile.worker \
          --build-arg "WORKER_DEPS_IMAGE=$WORKER_DEPS_IMAGE" -t "$WORKER_IMAGE" .
        test "$(docker image inspect --format '{{.Id}}' "$WORKER_DEPS_IMAGE")" = "$LOCAL_DEPS_ID"
        echo "LOCAL_WORKER_ID=$(docker image inspect --format '{{.Id}}' "$WORKER_IMAGE")" >> "$GITHUB_ENV"
    - name: Check worker final environment offline
      id: worker-contract
      env:
        WORKER_REF: ${{ env.WORKER_IMAGE }}
      run: docker run --rm --network none --entrypoint python "$WORKER_REF" scripts/check_image_contract.py --role worker
    - name: Release completed worker build cache and pulls
      env:
        WORKER_REF: ${{ env.WORKER_IMAGE }}
        NOTEVERSE_EPHEMERAL_RUNNER: ${{ runner.environment }}
      run: python3 .github/scripts/backend_worker_runner_disk.py release --builder docker --image worker --remove-image "$WORKER_DEPS_IMAGE"
    - name: Prepare bounded worker SBOM temporary space
      env:
        NOTEVERSE_EPHEMERAL_RUNNER: ${{ runner.environment }}
      run: python3 .github/scripts/backend_worker_runner_disk.py before-sbom --builder docker --image worker
    - name: Generate worker SPDX SBOM
      id: worker-sbom
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
      with:
        image: ${{ env.WORKER_IMAGE }}
        format: spdx-json
        artifact-name: backend-worker-image-sbom.spdx.json
      env:
        TMPDIR: ${{ runner.temp }}/noteverse-worker/worker-sbom/tmp
    - name: Remove completed worker SBOM temporary space
      if: always() && steps.worker-sbom.outcome != 'skipped'
      env:
        NOTEVERSE_EPHEMERAL_RUNNER: ${{ runner.environment }}
      run: python3 .github/scripts/backend_worker_runner_disk.py after-sbom --builder docker --image worker
    - name: Reclaim disk before worker vulnerability scan
      env:
        NOTEVERSE_EPHEMERAL_RUNNER: ${{ runner.environment }}
      run: python3 .github/scripts/backend_worker_runner_disk.py before-scan --builder docker --image worker
    - name: Scan worker exact artifact
      id: worker-scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ${{ env.WORKER_IMAGE }}
        vuln-type: os,library
        severity: CRITICAL
        ignore-unfixed: true
        format: table
        exit-code: '1'
        timeout: 20m
        cache: false
      env:
        TMPDIR: ${{ runner.temp }}/noteverse-worker/worker-scan/tmp
        TRIVY_CACHE_DIR: ${{ runner.temp }}/noteverse-worker/worker-scan/cache
        TRIVY_IMAGE_SRC: docker
    - name: Remove completed worker scan export/cache
      if: always() && steps.worker-scan.outcome != 'skipped'
      env:
        NOTEVERSE_EPHEMERAL_RUNNER: ${{ runner.environment }}
      run: python3 .github/scripts/backend_worker_runner_disk.py after-scan --builder docker --image worker
    - name: Write read-only Worker validation summary
      env:
        BASE_REF: ${{ steps.base.outputs.digest_ref }}
        BUILD_KEY: ${{ steps.key.outputs.build_key }}
      run: |-
        {
          echo "## Worker PR validation (no registry publication)"
          echo "- Python base immutable OCI: $BASE_REF"
          echo "- Dependency build key (input identity): $BUILD_KEY"
          echo "- Dependency canonical tag: deps-$BUILD_KEY"
          echo "- Local dependency Docker image ID: $LOCAL_DEPS_ID"
          echo "- Local final Worker Docker image ID: $LOCAL_WORKER_ID"
          echo "- Local IDs are not published OCI identities; PR event source is $GITHUB_SHA"
          echo "- Dependency/final packaging, SPDX SBOMs and unchanged CRITICAL scans passed"
          echo "- No canonical promotion, image publication, base rebuild or GPU qualification"
        } >> "$GITHUB_STEP_SUMMARY"
env:
  UV_PYTHON: '3.12'
  UV_PYTHON_DOWNLOADS: never
