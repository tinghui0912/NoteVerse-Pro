name: Customer Web Quality

on:
  push:
    branches: [main]
    paths:
      - "apps/customer-web/**"
      - "backend/docs/contracts/openapi/customer-api.json"
      - "backend/app/shared/error_codes.py"
      - ".github/workflows/customer-web-quality.yml"
      - ".github/scripts/customer_web_ci_policy.py"
      - ".github/scripts/test_customer_web_ci_policy.py"
      - ".github/dependency-exceptions.json"
      - ".github/scripts/dependency_governance.py"
      - ".github/scripts/test_dependency_governance.py"
      - "docs/governance/dependency-maintenance-policy.md"
  pull_request:
    paths:
      - "apps/customer-web/**"
      - "backend/docs/contracts/openapi/customer-api.json"
      - "backend/app/shared/error_codes.py"
      - ".github/workflows/customer-web-quality.yml"
      - ".github/scripts/customer_web_ci_policy.py"
      - ".github/scripts/test_customer_web_ci_policy.py"
      - ".github/dependency-exceptions.json"
      - ".github/scripts/dependency_governance.py"
      - ".github/scripts/test_dependency_governance.py"
      - "docs/governance/dependency-maintenance-policy.md"

concurrency:
  group: customer-web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    defaults:
      run:
        working-directory: apps/customer-web
    env:
      NEXT_BACKEND_ORIGIN: http://127.0.0.1:8000
      AUTH_COOKIE_NAME: noteverse_session
      REFRESH_COOKIE_NAME: noteverse_refresh

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Customer Web CI policy
        working-directory: .
        run: python3 -m unittest discover -s .github/scripts -p test_customer_web_ci_policy.py -v

      - name: Check dependency override governance
        working-directory: .
        run: |
          python3 -m unittest discover -s .github/scripts -p test_dependency_governance.py -v
          python3 .github/scripts/dependency_governance.py

      - name: Verify reusable PR Quality proof
        id: proof
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "reuse_pr_quality=false" >> "$GITHUB_OUTPUT"
          if ! python3 .github/scripts/customer_web_ci_policy.py quality; then
            echo "reuse_pr_quality=false" >> "$GITHUB_OUTPUT"
            echo "Quality proof helper unavailable; complete Quality suite required." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.proof.outputs.reuse_pr_quality != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/customer-web/package-lock.json

      - name: Install dependencies
        if: steps.proof.outputs.reuse_pr_quality != 'true'
        run: npm ci

      - name: Run ESLint
        if: steps.proof.outputs.reuse_pr_quality != 'true'
        run: npm run lint

      - name: Check API error translations
        if: steps.proof.outputs.reuse_pr_quality != 'true'
        run: npm run check:i18n-errors

      - name: Check generated API types
        if: steps.proof.outputs.reuse_pr_quality != 'true'
        run: npm run check:api-types

      - name: Run dead-code check
        if: steps.proof.outputs.reuse_pr_quality != 'true'
        run: npm run check:dead-code

      - name: Run TypeScript checks
        if: steps.proof.outputs.reuse_pr_quality != 'true'
        run: npm run typecheck

      - name: Run unit and component tests
        if: steps.proof.outputs.reuse_pr_quality != 'true'
        run: npm run test

      - name: Build production frontend
        if: steps.proof.outputs.reuse_pr_quality != 'true'
        run: npm run build

      - name: Install Playwright Chromium
        if: steps.proof.outputs.reuse_pr_quality != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        if: steps.proof.outputs.reuse_pr_quality != 'true'
        run: npm run test:e2e

      - name: Record successful PR Quality identity
        if: github.event_name == 'pull_request'
        working-directory: .
        run: python3 .github/scripts/customer_web_ci_policy.py write-pr-proof --proof-directory "$RUNNER_TEMP/customer-web-quality-proof"

      - name: Upload PR Quality proof
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: customer-web-quality-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/customer-web-quality-proof/quality-proof.json
          if-no-files-found: error
          retention-days: 30
