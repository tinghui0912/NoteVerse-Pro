name: Customer Web Quality

on:
  push:
    branches: [main]
    paths:
      - "apps/customer-web/**"
      - "backend/docs/contracts/openapi/customer-api.json"
      - "backend/docs/contracts/openapi/practice-api.json"
      - "backend/docs/contracts/realtime/practice-websocket-v1.json"
      - "backend/app/shared/error_codes.py"
      - ".github/workflows/customer-web-quality.yml"
  pull_request:
    paths:
      - "apps/customer-web/**"
      - "backend/docs/contracts/openapi/customer-api.json"
      - "backend/docs/contracts/openapi/practice-api.json"
      - "backend/docs/contracts/realtime/practice-websocket-v1.json"
      - "backend/app/shared/error_codes.py"
      - ".github/workflows/customer-web-quality.yml"

concurrency:
  group: customer-web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer-web
    env:
      NEXT_BACKEND_ORIGIN: http://127.0.0.1:8000
      NEXT_PRACTICE_ORIGIN: http://127.0.0.1:8001
      AUTH_COOKIE_NAME: noteverse_session
      REFRESH_COOKIE_NAME: noteverse_refresh

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/customer-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check API error translations
        run: npm run check:i18n-errors

      - name: Check generated API types
        run: npm run check:api-types

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm run test

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
