name: Customer Web Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/customer-web/**"
      - "docker/customer-web/**"
      - ".dockerignore"
      - ".github/workflows/customer-web-image.yml"
  pull_request:
    paths:
      - "apps/customer-web/**"
      - "docker/customer-web/**"
      - ".dockerignore"
      - ".github/workflows/customer-web-image.yml"

concurrency:
  group: customer-web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH_IMAGE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Classify runtime image changes
        id: changes
        shell: bash
        run: |
          python3 - <<'PY'
          import fnmatch
          import json
          import os
          from pathlib import Path, PurePosixPath
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args]).decode("utf-8", errors="surrogateescape").rstrip("\n")

          def ensure_commit(sha):
              if subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"],
                                stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                  git("fetch", "--no-tags", "--depth=1", "origin", sha)

          def runtime_relevant(path):
              if path in {".dockerignore", ".github/workflows/customer-web-image.yml"}:
                  return True
              if path.startswith("docker/customer-web/"):
                  return True
              if not path.startswith("apps/customer-web/"):
                  return False
              name = PurePosixPath(path).name
              return not (path.startswith("apps/customer-web/tests/")
                          or fnmatch.fnmatchcase(name, "*.test.*")
                          or fnmatch.fnmatchcase(name, "*.spec.*"))

          event_name = os.environ["GITHUB_EVENT_NAME"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          paths = []
          if event_name == "workflow_dispatch":
              runtime_changed = True
              reason = "Manual execution always runs the full image pipeline."
          else:
              if event_name == "pull_request":
                  base = event["pull_request"]["base"]["sha"]
                  head = event["pull_request"]["head"]["sha"]
                  ensure_commit(base)
                  ensure_commit(head)
                  # Deepen only as needed to find the full PR's merge base.
                  depth = 32
                  while True:
                      common = subprocess.run(["git", "merge-base", base, head], capture_output=True, text=True)
                      if common.returncode == 0:
                          base = common.stdout.strip()
                          break
                      if git("rev-parse", "--is-shallow-repository") != "true":
                          raise RuntimeError("Cannot determine the PR merge base")
                      git("fetch", "--no-tags", f"--deepen={depth}", "origin", base, head)
                      depth *= 2
              elif event_name == "push":
                  base, head = event["before"], os.environ["GITHUB_SHA"]
                  ensure_commit(head)
                  if base == "0" * 40:
                      base = subprocess.check_output(["git", "hash-object", "-t", "tree", "--stdin"], input=b"").decode().strip()
                  else:
                      ensure_commit(base)
              else:
                  raise RuntimeError(f"Unsupported event: {event_name}")

              # Include both sides of renames so a runtime file cannot disappear into an excluded path.
              paths = git("diff", "--no-renames", "--name-only", "-z", base, head).split("\0")
              paths = [path for path in paths if path]
              runtime_changed = any(runtime_relevant(path) for path in paths)
              reason = f"Compared {base} -> {head}; evaluated {len(paths)} changed paths."

          for path in paths:
              print(f"runtime_relevant={str(runtime_relevant(path)).lower()} path={json.dumps(path)}")
          result = str(runtime_changed).lower()
          print(reason)
          print(f"runtime_changed={result}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"runtime_changed={result}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Customer Web image change classification\n\n{reason}\n\nRuntime image relevant: `{result}`\n\n")
          PY

      - name: Write no-runtime-change summary
        if: steps.changes.outputs.runtime_changed == 'false'
        run: |
          echo "Customer Web runtime image build skipped: no runtime-affecting paths changed; Customer Web test-only paths do not require an image." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve image namespace
        if: steps.changes.outputs.runtime_changed == 'true'
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/noteverse" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.runtime_changed == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        if: steps.changes.outputs.runtime_changed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build Customer Web runtime image
        if: steps.changes.outputs.runtime_changed == 'true'
        id: customer_web_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/customer-web/Dockerfile.runtime
          push: ${{ env.PUSH_IMAGE == 'true' }}
          load: ${{ env.PUSH_IMAGE != 'true' }}
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/customer-web:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/customer-web:build-${{ github.run_id }}
          build-args: |
            NEXT_BACKEND_ORIGIN=http://noteverse-backend-api:8000
            SESSION_COOKIE_NAME=noteverse_session
            SESSION_REFRESH_COOKIE_NAME=noteverse_refresh

      - name: Generate Customer Web SBOM
        if: steps.changes.outputs.runtime_changed == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/customer-web:${{ github.sha }}
          format: spdx-json
          artifact-name: customer-web-image-sbom.spdx.json

      - name: Scan Customer Web image
        if: steps.changes.outputs.runtime_changed == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/customer-web:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Write image build summary
        if: steps.changes.outputs.runtime_changed == 'true'
        run: |
          {
            echo "## Customer Web image build"
            echo ""
            echo "- Push image: \`${PUSH_IMAGE}\`"
            echo "- Customer Web image: \`${IMAGE_NAMESPACE}/customer-web:${GITHUB_SHA}\`"
            echo "- Customer Web digest: \`${{ steps.customer_web_build.outputs.digest }}\`"
            echo "- SBOM artifact: customer-web-image-sbom.spdx.json"
            echo "- Vulnerability gate: CRITICAL, ignore unfixed"
          } >> "$GITHUB_STEP_SUMMARY"
