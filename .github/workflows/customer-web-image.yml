name: Customer Web Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/customer-web/**"
      - "docker/customer-web/**"
      - ".dockerignore"
      - ".github/workflows/customer-web-image.yml"
      - ".github/workflows/customer-web-quality.yml"
      - ".github/scripts/customer_web_ci_policy.py"
      - ".github/scripts/test_customer_web_ci_policy.py"
  pull_request:
    paths:
      - "apps/customer-web/**"
      - "docker/customer-web/**"
      - ".dockerignore"
      - ".github/workflows/customer-web-image.yml"
      - ".github/workflows/customer-web-quality.yml"
      - ".github/scripts/customer_web_ci_policy.py"
      - ".github/scripts/test_customer_web_ci_policy.py"

concurrency:
  group: customer-web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH_IMAGE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Customer Web CI policy
        run: python3 -m unittest discover -s .github/scripts -p test_customer_web_ci_policy.py -v

      - name: Classify runtime image changes
        id: changes
        run: python3 .github/scripts/customer_web_ci_policy.py image

      - name: Write no-runtime-change summary
        if: steps.changes.outputs.runtime_changed == 'false'
        run: |
          echo "Customer Web runtime image build skipped: no runtime-affecting paths changed; Customer Web test-only paths do not require an image." >> "$GITHUB_STEP_SUMMARY"

      - name: Write source-only PR image summary
        if: github.event_name == 'pull_request' && steps.changes.outputs.runtime_changed == 'true' && steps.changes.outputs.pr_image_validation_required == 'false'
        run: |
          {
            echo "Customer Web runtime application content changed."
            echo "The PR production build is validated by Customer Web Quality."
            echo "No image-risk dependency/container path changed."
            echo "The full runtime image will be built, scanned and published after merge to main."
            echo "pr_image_validation_required=false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve image namespace
        if: steps.changes.outputs.image_pipeline_required == 'true'
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/noteverse" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.image_pipeline_required == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.changes.outputs.image_pipeline_required == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build Customer Web runtime image
        if: steps.changes.outputs.image_pipeline_required == 'true'
        id: customer_web_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/customer-web/Dockerfile.runtime
          push: ${{ env.PUSH_IMAGE == 'true' }}
          load: ${{ env.PUSH_IMAGE != 'true' }}
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/customer-web:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/customer-web:build-${{ github.run_id }}
          build-args: |
            NEXT_BACKEND_ORIGIN=http://noteverse-backend-api:8000

      - name: Generate Customer Web SBOM
        if: steps.changes.outputs.image_pipeline_required == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/customer-web:${{ github.sha }}
          format: spdx-json
          artifact-name: customer-web-image-sbom.spdx.json

      - name: Scan Customer Web image
        if: steps.changes.outputs.image_pipeline_required == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/customer-web:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Write image build summary
        if: steps.changes.outputs.image_pipeline_required == 'true'
        run: |
          {
            echo "## Customer Web image build"
            echo ""
            echo "- Push image: \`${PUSH_IMAGE}\`"
            echo "- Customer Web image: \`${IMAGE_NAMESPACE}/customer-web:${GITHUB_SHA}\`"
            echo "- Customer Web digest: \`${{ steps.customer_web_build.outputs.digest }}\`"
            echo "- SBOM artifact: customer-web-image-sbom.spdx.json"
            echo "- Vulnerability gate: CRITICAL, ignore unfixed"
          } >> "$GITHUB_STEP_SUMMARY"
