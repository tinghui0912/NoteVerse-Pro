name: Platform Admin Quality

on:
  push:
    branches: [main]
    paths:
      - "apps/platform-admin/**"
      - ".github/workflows/platform-admin-quality.yml"
  pull_request:
    paths:
      - "apps/platform-admin/**"
      - ".github/workflows/platform-admin-quality.yml"

concurrency:
  group: platform-admin-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform-admin
    env:
      NEXT_CONTROL_PLANE_ORIGIN: http://127.0.0.1:8002
      NEXT_PUBLIC_CONTROL_PLANE_CSRF_COOKIE_NAME: noteverse_operator_csrf
      NEXT_PUBLIC_CONTROL_PLANE_CSRF_HEADER_NAME: x-operator-csrf-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/platform-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build production platform admin
        run: npm run build
