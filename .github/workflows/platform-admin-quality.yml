name: Platform Admin Quality

on:
  push:
    branches: [main]
    paths:
      - "apps/platform-admin/**"
      - "backend/docs/contracts/openapi/control-plane-api.json"
      - "contracts/http/control-plane-browser-protocol.json"
      - "scripts/generate_control_plane_browser_protocol.py"
      - ".github/workflows/platform-admin-quality.yml"
      - ".github/dependency-exceptions.json"
      - ".github/scripts/dependency_governance.py"
      - ".github/scripts/test_dependency_governance.py"
      - "docs/governance/dependency-maintenance-policy.md"
  pull_request:
    paths:
      - "apps/platform-admin/**"
      - "backend/docs/contracts/openapi/control-plane-api.json"
      - "contracts/http/control-plane-browser-protocol.json"
      - "scripts/generate_control_plane_browser_protocol.py"
      - ".github/workflows/platform-admin-quality.yml"
      - ".github/dependency-exceptions.json"
      - ".github/scripts/dependency_governance.py"
      - ".github/scripts/test_dependency_governance.py"
      - "docs/governance/dependency-maintenance-policy.md"

concurrency:
  group: platform-admin-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform-admin
    env:
      NEXT_CONTROL_PLANE_ORIGIN: http://127.0.0.1:8002

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check dependency override governance
        working-directory: .
        run: |
          python3 -m unittest discover -s .github/scripts -p test_dependency_governance.py -v
          python3 .github/scripts/dependency_governance.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/platform-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated API
        run: npm run check:api

      - name: Check browser protocol
        run: npm run check:browser-protocol

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build production platform admin
        run: npm run build
