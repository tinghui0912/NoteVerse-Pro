name: Backend Worker Image

on:
  workflow_dispatch:
    inputs:
      ml_base_tag:
        description: "Pinned ML base image tag used for worker builds"
        required: true
        default: "py312-torch260-cu124-slim"
      worker_deps_tag:
        description: "Optional worker dependency image tag. Leave empty to use a content fingerprint tag."
        required: false
        default: ""
      legato_repo_url:
        description: "LEGATO source repository URL"
        required: true
        default: "https://github.com/guang-yng/legato.git"
      legato_repo_commit:
        description: "Pinned LEGATO commit"
        required: true
        default: "179c228d3d5f67113cf739b44891b3abe046f1dc"

concurrency:
  group: backend-worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      ML_BASE_TAG: ${{ inputs.ml_base_tag || 'py312-torch260-cu124-slim' }}
      WORKER_DEPS_TAG_INPUT: ${{ inputs.worker_deps_tag }}
      LEGATO_REPO_URL: ${{ inputs.legato_repo_url || 'https://github.com/guang-yng/legato.git' }}
      LEGATO_REPO_COMMIT: ${{ inputs.legato_repo_commit || '179c228d3d5f67113cf739b44891b3abe046f1dc' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/noteverse" >> "$GITHUB_ENV"

      - name: Resolve ML base image
        run: echo "ML_BASE_IMAGE=${IMAGE_NAMESPACE}/ml-base:${ML_BASE_TAG}" >> "$GITHUB_ENV"

      - name: Resolve worker dependency image
        run: |
          WORKER_DEPS_HASH="$(
            {
              sha256sum \
                docker/backend/Dockerfile.worker-deps \
                backend/requirements/worker-app.txt \
                backend/requirements/tracing.txt \
                backend/requirements/ocr.txt
              printf '%s\n' "${ML_BASE_IMAGE}"
              printf '%s\n' "${LEGATO_REPO_URL}"
              printf '%s\n' "${LEGATO_REPO_COMMIT}"
              printf '%s\n' "INSTALL_PADDLE_GPU=false"
              printf '%s\n' "INSTALL_LEGATO_EXTRA_DEPS=false"
            } | sha256sum | cut -c1-16
          )"
          if [ -n "${WORKER_DEPS_TAG_INPUT}" ]; then
            WORKER_DEPS_TAG="${WORKER_DEPS_TAG_INPUT}"
          else
            WORKER_DEPS_TAG="deps-${WORKER_DEPS_HASH}"
          fi
          echo "WORKER_DEPS_HASH=${WORKER_DEPS_HASH}" >> "$GITHUB_ENV"
          echo "WORKER_DEPS_TAG=${WORKER_DEPS_TAG}" >> "$GITHUB_ENV"
          echo "WORKER_DEPS_IMAGE=${IMAGE_NAMESPACE}/backend-worker-deps:${WORKER_DEPS_TAG}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Free hosted runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pull ML base image
        run: |
          docker pull "${ML_BASE_IMAGE}" || {
            echo "::error::Missing ${ML_BASE_IMAGE}. Run the ML Base Image workflow first, then rerun this worker image workflow."
            exit 1
          }

      - name: Build and push backend worker dependency image
        id: backend-worker-deps-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/backend/Dockerfile.worker-deps
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.WORKER_DEPS_IMAGE }}
            ${{ env.IMAGE_NAMESPACE }}/backend-worker-deps:build-${{ github.run_id }}
          build-args: |
            PYTHON_IMAGE=${{ env.ML_BASE_IMAGE }}
            INSTALL_PADDLE_GPU=false
            INSTALL_LEGATO_EXTRA_DEPS=false
            LEGATO_REPO_URL=${{ env.LEGATO_REPO_URL }}
            LEGATO_REPO_COMMIT=${{ env.LEGATO_REPO_COMMIT }}

      - name: Build and push backend worker runtime image
        id: backend-worker-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/backend/Dockerfile.worker
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/backend-worker:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/backend-worker:build-${{ github.run_id }}
          build-args: |
            WORKER_DEPS_IMAGE=${{ env.WORKER_DEPS_IMAGE }}

      - name: Generate backend worker dependency SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.WORKER_DEPS_IMAGE }}
          format: spdx-json
          artifact-name: backend-worker-deps-image-sbom.spdx.json

      - name: Generate backend worker SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/backend-worker:${{ github.sha }}
          format: spdx-json
          artifact-name: backend-worker-image-sbom.spdx.json

      - name: Scan backend worker dependency image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.WORKER_DEPS_IMAGE }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Scan backend worker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/backend-worker:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Write image build summary
        run: |
          {
            echo "## Backend worker image build"
            echo ""
            echo "- Push images: \`true\`"
            echo "- Worker image: \`${IMAGE_NAMESPACE}/backend-worker:${GITHUB_SHA}\`"
            echo "- Worker digest: \`${{ steps.backend-worker-build.outputs.digest }}\`"
            echo "- ML base: \`${ML_BASE_IMAGE}\`"
            echo "- Worker deps image: \`${WORKER_DEPS_IMAGE}\`"
            echo "- Worker deps digest: \`${{ steps.backend-worker-deps-build.outputs.digest }}\`"
            echo "- LEGATO source: \`${LEGATO_REPO_URL}@${LEGATO_REPO_COMMIT}\`"
            echo "- SBOM artifacts: backend-worker-deps-image-sbom.spdx.json, backend-worker-image-sbom.spdx.json"
            echo "- Vulnerability gate: CRITICAL, ignore unfixed"
          } >> "$GITHUB_STEP_SUMMARY"
