name: Frontend Quality

on:
  push:
    paths:
      - "frontend/**"
      - "backend/app/shared/error_codes.py"
      - ".github/workflows/frontend-quality.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/app/shared/error_codes.py"
      - ".github/workflows/frontend-quality.yml"

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_BACKEND_ORIGIN: http://127.0.0.1:8000
      AUTH_COOKIE_NAME: noteverse_session
      REFRESH_COOKIE_NAME: noteverse_refresh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check API error translations
        run: npm run check:i18n-errors

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm run test

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
