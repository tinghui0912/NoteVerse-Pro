name: K8s Application Manifests

on:
  push:
    branches: [main]
    paths:
      - "deploy/application/**"
      - "deploy/gitops/**"
      - "scripts/check_k8s_application_manifests.py"
      - "scripts/check_gitops_manifests.py"
      - "scripts/promote_release_package_to_gitops.py"
      - "scripts/render_k8s_release_overlay.py"
      - ".github/workflows/k8s-application-manifests.yml"
  pull_request:
    paths:
      - "deploy/application/**"
      - "deploy/gitops/**"
      - "scripts/check_k8s_application_manifests.py"
      - "scripts/check_gitops_manifests.py"
      - "scripts/promote_release_package_to_gitops.py"
      - "scripts/render_k8s_release_overlay.py"
      - ".github/workflows/k8s-application-manifests.yml"

concurrency:
  group: k8s-application-manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -L -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Validate public application templates
        run: python scripts/check_k8s_application_manifests.py

      - name: Validate GitOps desired state
        run: python scripts/check_gitops_manifests.py

      - name: Verify strict mode rejects public production template
        run: |
          if python scripts/check_k8s_application_manifests.py deploy/application/overlays/production --strict; then
            echo "::error::Strict K8s manifest validation unexpectedly accepted the public production template."
            exit 1
          fi
          echo "Strict mode rejected the public production template as expected."

      - name: Verify release overlay renderer
        run: |
          python scripts/render_k8s_release_overlay.py \
            --environment staging \
            --output build/k8s-release-check/staging \
            --backend-api-image ghcr.io/example/noteverse/backend-api@sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            --backend-practice-image ghcr.io/example/noteverse/backend-practice@sha256:5555555555555555555555555555555555555555555555555555555555555555 \
            --backend-beat-image ghcr.io/example/noteverse/backend-beat@sha256:4444444444444444444444444444444444444444444444444444444444444444 \
            --backend-worker-image ghcr.io/example/noteverse/backend-worker@sha256:3333333333333333333333333333333333333333333333333333333333333333 \
            --customer-web-image ghcr.io/example/noteverse/customer-web@sha256:2222222222222222222222222222222222222222222222222222222222222222 \
            --platform-admin-image ghcr.io/example/noteverse/platform-admin@sha256:6666666666666666666666666666666666666666666666666666666666666666 \
            --customer-web-host staging.noteverse.test \
            --admin-host admin.staging.noteverse.test \
            --tls-secret noteverse-staging-real-tls \
            --customer-web-base-url https://staging.noteverse.test \
            --backend-cors-origins '["https://staging.noteverse.test"]' \
            --control-plane-cors-origins '["https://admin.staging.noteverse.test"]' \
            --trusted-proxy-cidrs '["10.244.0.0/16"]' \
            --auth-cookie-secure true \
            --mail-default-sender 'NoteVerse Pro <no-reply@staging.noteverse.test>' \
            --s3-endpoint-url https://object-storage.noteverse.test \
            --s3-region auto \
            --s3-bucket noteverse-staging \
            --s3-public-base-url https://objects.staging.noteverse.test \
            --s3-force-path-style true \
            --s3-presign-expire-seconds 900

          python scripts/check_k8s_application_manifests.py build/k8s-release-check/staging --strict

          test -f build/k8s-release-check/staging/base/kustomization.yaml
          cp deploy/gitops/environments/staging/release-metadata.json build/k8s-release-check/staging/release-metadata.json
          python scripts/promote_release_package_to_gitops.py \
            --source build/k8s-release-check/staging \
            --environment staging \
            --output build/k8s-release-check/gitops-staging \
            --overwrite
          python scripts/check_gitops_manifests.py build/k8s-release-check/gitops-staging
