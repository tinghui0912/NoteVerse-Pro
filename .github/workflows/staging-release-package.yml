name: Staging Release Package

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Shared immutable image tag. Defaults to the current commit SHA."
        required: false
        type: string
      backend_api_image:
        description: "Optional full backend API image reference override"
        required: false
        type: string
      backend_beat_image:
        description: "Optional full backend beat image reference override"
        required: false
        type: string
      backend_practice_image:
        description: "Optional full backend practice image reference override"
        required: false
        type: string
      backend_worker_image:
        description: "Optional full backend worker image reference override"
        required: false
        type: string
      frontend_image:
        description: "Optional full frontend image reference override"
        required: false
        type: string
      platform_admin_image:
        description: "Optional full Platform Admin image reference override"
        required: false
        type: string
      open_gitops_pr:
        description: "Open a PR that promotes this package into deploy/gitops/environments/staging"
        required: false
        default: false
        type: boolean
      gitops_base_branch:
        description: "Base branch for the optional GitOps PR"
        required: false
        default: main
        type: string

concurrency:
  group: staging-release-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -L -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Resolve release inputs
        run: |
          set -euo pipefail

          IMAGE_NAMESPACE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/noteverse"
          IMAGE_TAG="${{ inputs.image_tag }}"

          BACKEND_API_IMAGE="${{ inputs.backend_api_image }}"
          BACKEND_BEAT_IMAGE="${{ inputs.backend_beat_image }}"
          BACKEND_PRACTICE_IMAGE="${{ inputs.backend_practice_image }}"
          BACKEND_WORKER_IMAGE="${{ inputs.backend_worker_image }}"
          FRONTEND_IMAGE="${{ inputs.frontend_image }}"
          PLATFORM_ADMIN_IMAGE="${{ inputs.platform_admin_image }}"

          if [ -n "${IMAGE_TAG}" ]; then
            if [ -z "${BACKEND_API_IMAGE}" ]; then
              BACKEND_API_IMAGE="${IMAGE_NAMESPACE}/backend-api:${IMAGE_TAG}"
            fi
            if [ -z "${BACKEND_BEAT_IMAGE}" ]; then
              BACKEND_BEAT_IMAGE="${IMAGE_NAMESPACE}/backend-beat:${IMAGE_TAG}"
            fi
            if [ -z "${BACKEND_PRACTICE_IMAGE}" ]; then
              BACKEND_PRACTICE_IMAGE="${IMAGE_NAMESPACE}/backend-practice:${IMAGE_TAG}"
            fi
            if [ -z "${BACKEND_WORKER_IMAGE}" ]; then
              BACKEND_WORKER_IMAGE="${IMAGE_NAMESPACE}/backend-worker:${IMAGE_TAG}"
            fi
            if [ -z "${FRONTEND_IMAGE}" ]; then
              FRONTEND_IMAGE="${IMAGE_NAMESPACE}/frontend:${IMAGE_TAG}"
            fi
            if [ -z "${PLATFORM_ADMIN_IMAGE}" ]; then
              PLATFORM_ADMIN_IMAGE="${IMAGE_NAMESPACE}/platform-admin:${IMAGE_TAG}"
            fi
          else
            CURRENT_METADATA="deploy/gitops/environments/staging/release-metadata.json"
            if [ ! -f "${CURRENT_METADATA}" ]; then
              echo "::error::${CURRENT_METADATA} is required when image_tag is empty. Provide image_tag for a full release or keep the current staging metadata in GitOps desired state."
              exit 1
            fi

            read_current_image() {
              local key="$1"
              python -c 'import json, sys; from pathlib import Path; metadata=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); image=metadata.get("images", {}).get(sys.argv[2]); isinstance(image, str) and "@sha256:" in image or (_ for _ in ()).throw(SystemExit(f"missing digest-pinned current image for {sys.argv[2]}")); print(image)' "${CURRENT_METADATA}" "${key}"
            }

            if [ -z "${BACKEND_API_IMAGE}" ]; then
              BACKEND_API_IMAGE="$(read_current_image backend_api)"
            fi
            if [ -z "${BACKEND_BEAT_IMAGE}" ]; then
              BACKEND_BEAT_IMAGE="$(read_current_image backend_beat)"
            fi
            if [ -z "${BACKEND_PRACTICE_IMAGE}" ]; then
              BACKEND_PRACTICE_IMAGE="$(read_current_image backend_practice)"
            fi
            if [ -z "${BACKEND_WORKER_IMAGE}" ]; then
              BACKEND_WORKER_IMAGE="$(read_current_image backend_worker)"
            fi
            if [ -z "${FRONTEND_IMAGE}" ]; then
              FRONTEND_IMAGE="$(read_current_image frontend)"
            fi
            if [ -z "${PLATFORM_ADMIN_IMAGE}" ]; then
              PLATFORM_ADMIN_IMAGE="$(read_current_image platform_admin)"
            fi

            IMAGE_TAG="current-staging-plus-overrides"
          fi

          {
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "BACKEND_API_IMAGE=${BACKEND_API_IMAGE}"
            echo "BACKEND_BEAT_IMAGE=${BACKEND_BEAT_IMAGE}"
            echo "BACKEND_PRACTICE_IMAGE=${BACKEND_PRACTICE_IMAGE}"
            echo "BACKEND_WORKER_IMAGE=${BACKEND_WORKER_IMAGE}"
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}"
            echo "PLATFORM_ADMIN_IMAGE=${PLATFORM_ADMIN_IMAGE}"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve release image digests
        run: |
          set -euo pipefail

          image_name_without_reference() {
            local image="$1"
            if [[ "${image}" == *@sha256:* ]]; then
              echo "${image%@*}"
              return
            fi

            local prefix="${image%/*}"
            local last="${image##*/}"
            if [[ "${last}" != *:* ]]; then
              echo "Image reference must include a tag or digest: ${image}" >&2
              return 1
            fi
            echo "${prefix}/${last%%:*}"
          }

          inspect_digest() {
            local image="$1"
            echo "Inspecting ${image}" >&2
            local output
            output="$(docker buildx imagetools inspect "${image}")"
            local digest
            digest="$(printf "%s\n" "${output}" | awk '/^Digest:/ {print $2; exit}')"
            if [[ ! "${digest}" =~ ^sha256: ]]; then
              echo "Could not resolve digest for image: ${image}" >&2
              return 1
            fi
            echo "${digest}"
          }

          BACKEND_API_IMAGE_DIGEST="$(inspect_digest "${BACKEND_API_IMAGE}")"
          BACKEND_BEAT_IMAGE_DIGEST="$(inspect_digest "${BACKEND_BEAT_IMAGE}")"
          BACKEND_PRACTICE_IMAGE_DIGEST="$(inspect_digest "${BACKEND_PRACTICE_IMAGE}")"
          BACKEND_WORKER_IMAGE_DIGEST="$(inspect_digest "${BACKEND_WORKER_IMAGE}")"
          FRONTEND_IMAGE_DIGEST="$(inspect_digest "${FRONTEND_IMAGE}")"
          PLATFORM_ADMIN_IMAGE_DIGEST="$(inspect_digest "${PLATFORM_ADMIN_IMAGE}")"

          {
            echo "BACKEND_API_IMAGE_DIGEST=${BACKEND_API_IMAGE_DIGEST}"
            echo "BACKEND_BEAT_IMAGE_DIGEST=${BACKEND_BEAT_IMAGE_DIGEST}"
            echo "BACKEND_PRACTICE_IMAGE_DIGEST=${BACKEND_PRACTICE_IMAGE_DIGEST}"
            echo "BACKEND_WORKER_IMAGE_DIGEST=${BACKEND_WORKER_IMAGE_DIGEST}"
            echo "FRONTEND_IMAGE_DIGEST=${FRONTEND_IMAGE_DIGEST}"
            echo "PLATFORM_ADMIN_IMAGE_DIGEST=${PLATFORM_ADMIN_IMAGE_DIGEST}"
            echo "BACKEND_API_IMAGE_PINNED=$(image_name_without_reference "${BACKEND_API_IMAGE}")@${BACKEND_API_IMAGE_DIGEST}"
            echo "BACKEND_BEAT_IMAGE_PINNED=$(image_name_without_reference "${BACKEND_BEAT_IMAGE}")@${BACKEND_BEAT_IMAGE_DIGEST}"
            echo "BACKEND_PRACTICE_IMAGE_PINNED=$(image_name_without_reference "${BACKEND_PRACTICE_IMAGE}")@${BACKEND_PRACTICE_IMAGE_DIGEST}"
            echo "BACKEND_WORKER_IMAGE_PINNED=$(image_name_without_reference "${BACKEND_WORKER_IMAGE}")@${BACKEND_WORKER_IMAGE_DIGEST}"
            echo "FRONTEND_IMAGE_PINNED=$(image_name_without_reference "${FRONTEND_IMAGE}")@${FRONTEND_IMAGE_DIGEST}"
            echo "PLATFORM_ADMIN_IMAGE_PINNED=$(image_name_without_reference "${PLATFORM_ADMIN_IMAGE}")@${PLATFORM_ADMIN_IMAGE_DIGEST}"
          } >> "$GITHUB_ENV"

      - name: Render staging release overlay
        run: |
          python scripts/render_k8s_release_overlay.py \
            --environment staging \
            --output build/k8s-release/staging \
            --backend-api-image "${BACKEND_API_IMAGE_PINNED}" \
            --backend-beat-image "${BACKEND_BEAT_IMAGE_PINNED}" \
            --backend-practice-image "${BACKEND_PRACTICE_IMAGE_PINNED}" \
            --backend-worker-image "${BACKEND_WORKER_IMAGE_PINNED}" \
            --frontend-image "${FRONTEND_IMAGE_PINNED}" \
            --platform-admin-image "${PLATFORM_ADMIN_IMAGE_PINNED}" \
            --frontend-host "${{ vars.STAGING_FRONTEND_HOST }}" \
            --api-host "${{ vars.STAGING_API_HOST }}" \
            --tls-secret "${{ vars.STAGING_TLS_SECRET }}" \
            --frontend-base-url "${{ vars.STAGING_FRONTEND_BASE_URL }}" \
            --backend-cors-origins '${{ vars.STAGING_BACKEND_CORS_ORIGINS }}' \
            --control-plane-cors-origins '${{ vars.STAGING_CONTROL_PLANE_CORS_ORIGINS }}' \
            --trusted-proxy-cidrs '${{ vars.STAGING_TRUSTED_PROXY_CIDRS }}' \
            --auth-cookie-secure "${{ vars.STAGING_AUTH_COOKIE_SECURE }}" \
            --mail-default-sender "${{ vars.STAGING_MAIL_DEFAULT_SENDER }}" \
            --s3-endpoint-url "${{ vars.STAGING_S3_ENDPOINT_URL }}" \
            --s3-region "${{ vars.STAGING_S3_REGION }}" \
            --s3-bucket "${{ vars.STAGING_S3_BUCKET }}" \
            --s3-public-base-url "${{ vars.STAGING_S3_PUBLIC_BASE_URL }}" \
            --s3-force-path-style "${{ vars.STAGING_S3_FORCE_PATH_STYLE }}" \
            --s3-presign-expire-seconds "${{ vars.STAGING_S3_PRESIGN_EXPIRE_SECONDS }}"

      - name: Validate rendered overlay
        run: python scripts/check_k8s_application_manifests.py build/k8s-release/staging --strict

      - name: Write release metadata
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path("build/k8s-release/staging/release-metadata.json")
          metadata = {
              "environment": "staging",
              "commit_sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "actor": os.environ["GITHUB_ACTOR"],
              "rendered_at": datetime.now(timezone.utc).isoformat(),
              "image_tag": os.environ["IMAGE_TAG"],
              "images": {
                  "backend_api": os.environ["BACKEND_API_IMAGE_PINNED"],
                  "backend_beat": os.environ["BACKEND_BEAT_IMAGE_PINNED"],
                  "backend_practice": os.environ["BACKEND_PRACTICE_IMAGE_PINNED"],
                  "backend_worker": os.environ["BACKEND_WORKER_IMAGE_PINNED"],
                  "frontend": os.environ["FRONTEND_IMAGE_PINNED"],
                  "platform_admin": os.environ["PLATFORM_ADMIN_IMAGE_PINNED"],
              },
              "requested_images": {
                  "backend_api": os.environ["BACKEND_API_IMAGE"],
                  "backend_beat": os.environ["BACKEND_BEAT_IMAGE"],
                  "backend_practice": os.environ["BACKEND_PRACTICE_IMAGE"],
                  "backend_worker": os.environ["BACKEND_WORKER_IMAGE"],
                  "frontend": os.environ["FRONTEND_IMAGE"],
                  "platform_admin": os.environ["PLATFORM_ADMIN_IMAGE"],
              },
              "hosts": {
                  "frontend": "${{ vars.STAGING_FRONTEND_HOST }}",
                  "api": "${{ vars.STAGING_API_HOST }}",
              },
              "tls_secret": "${{ vars.STAGING_TLS_SECRET }}",
          }
          output.write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Render manifest artifact
        run: kubectl kustomize build/k8s-release/staging > build/k8s-release/staging.rendered.yaml

      - name: Upload rendered staging release package
        uses: actions/upload-artifact@v6
        with:
          name: staging-release-package
          path: |
            build/k8s-release/staging
            build/k8s-release/staging.rendered.yaml

      - name: Write staging release package summary
        run: |
          {
            echo "## Staging release package"
            echo ""
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- Backend API image: \`${BACKEND_API_IMAGE_PINNED}\`"
            echo "- Backend beat image: \`${BACKEND_BEAT_IMAGE_PINNED}\`"
            echo "- Backend practice image: \`${BACKEND_PRACTICE_IMAGE_PINNED}\`"
            echo "- Backend worker image: \`${BACKEND_WORKER_IMAGE_PINNED}\`"
            echo "- Frontend image: \`${FRONTEND_IMAGE_PINNED}\`"
            echo "- Platform Admin image: \`${PLATFORM_ADMIN_IMAGE_PINNED}\`"
            echo "- Metadata: \`build/k8s-release/staging/release-metadata.json\`"
            echo "- Artifact: \`staging-release-package\`"
            echo "- Open GitOps PR: \`${{ inputs.open_gitops_pr }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  gitops-pr:
    if: ${{ inputs.open_gitops_pr }}
    runs-on: ubuntu-latest
    needs: render
    environment: staging
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -L -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Download rendered staging release package
        uses: actions/download-artifact@v6
        with:
          name: staging-release-package
          path: build/k8s-release

      - name: Promote package into GitOps desired state
        run: |
          python scripts/promote_release_package_to_gitops.py \
            --source build/k8s-release/staging \
            --environment staging \
            --overwrite

      - name: Validate GitOps desired state
        run: |
          python scripts/check_gitops_manifests.py
          kubectl kustomize deploy/gitops/environments/staging > build/k8s-release/staging.gitops.rendered.yaml

      - name: Open GitOps pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ inputs.gitops_base_branch }}
          RELEASE_BRANCH: release/staging-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if git diff --quiet -- deploy/gitops/environments/staging; then
            echo "No GitOps changes to promote."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${RELEASE_BRANCH}"
          git add deploy/gitops/environments/staging
          git commit -m "Promote staging release ${GITHUB_SHA}"
          git push --set-upstream origin "${RELEASE_BRANCH}"

          {
            echo "## Staging release promotion"
            echo ""
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Release metadata: \`deploy/gitops/environments/staging/release-metadata.json\`"
            echo ""
            echo "This PR promotes the digest-pinned staging release package into GitOps desired state."
          } > build/k8s-release/staging/gitops-pr-body.md

          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${RELEASE_BRANCH}" \
            --title "Promote staging release ${GITHUB_SHA}" \
            --body-file build/k8s-release/staging/gitops-pr-body.md
