name: Staging Release Overlay

on:
  workflow_dispatch:
    inputs:
      backend_api_image:
        description: Backend API image tag or digest
        required: true
        type: string
      backend_beat_image:
        description: Backend beat image tag or digest
        required: true
        type: string
      backend_worker_image:
        description: Backend worker image tag or digest
        required: true
        type: string
      frontend_image:
        description: Frontend image tag or digest
        required: true
        type: string
      frontend_host:
        description: Staging frontend host
        required: true
        type: string
      api_host:
        description: Staging API host
        required: true
        type: string
      tls_secret:
        description: Existing staging TLS Secret name
        required: true
        type: string
      frontend_base_url:
        description: Public staging frontend base URL
        required: true
        type: string
      backend_cors_origins:
        description: JSON array of allowed browser origins
        required: true
        type: string
      auth_cookie_secure:
        description: Whether auth cookies use Secure=true
        required: true
        type: choice
        options:
          - "true"
          - "false"
      mail_default_sender:
        description: Public default sender address
        required: true
        type: string
      s3_endpoint_url:
        description: Object storage endpoint URL
        required: true
        type: string
      s3_region:
        description: Object storage region
        required: true
        type: string
      s3_bucket:
        description: Object storage bucket
        required: true
        type: string
      s3_public_base_url:
        description: Public object URL base
        required: true
        type: string
      s3_force_path_style:
        description: Whether to use path-style S3 URLs
        required: true
        type: choice
        options:
          - "true"
          - "false"
      s3_presign_expire_seconds:
        description: S3 presigned URL expiry in seconds
        required: true
        type: string

concurrency:
  group: staging-release-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install kubectl
        run: |
          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -L -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Render staging release overlay
        run: |
          python scripts/render_k8s_release_overlay.py \
            --environment staging \
            --output build/k8s-release/staging \
            --backend-api-image "${{ inputs.backend_api_image }}" \
            --backend-beat-image "${{ inputs.backend_beat_image }}" \
            --backend-worker-image "${{ inputs.backend_worker_image }}" \
            --frontend-image "${{ inputs.frontend_image }}" \
            --frontend-host "${{ inputs.frontend_host }}" \
            --api-host "${{ inputs.api_host }}" \
            --tls-secret "${{ inputs.tls_secret }}" \
            --frontend-base-url "${{ inputs.frontend_base_url }}" \
            --backend-cors-origins '${{ inputs.backend_cors_origins }}' \
            --auth-cookie-secure "${{ inputs.auth_cookie_secure }}" \
            --mail-default-sender "${{ inputs.mail_default_sender }}" \
            --s3-endpoint-url "${{ inputs.s3_endpoint_url }}" \
            --s3-region "${{ inputs.s3_region }}" \
            --s3-bucket "${{ inputs.s3_bucket }}" \
            --s3-public-base-url "${{ inputs.s3_public_base_url }}" \
            --s3-force-path-style "${{ inputs.s3_force_path_style }}" \
            --s3-presign-expire-seconds "${{ inputs.s3_presign_expire_seconds }}"

      - name: Validate rendered overlay
        run: python scripts/check_k8s_application_manifests.py build/k8s-release/staging --strict

      - name: Render manifest artifact
        run: kubectl kustomize build/k8s-release/staging > build/k8s-release/staging.rendered.yaml

      - name: Upload rendered staging overlay
        uses: actions/upload-artifact@v6
        with:
          name: staging-release-overlay
          path: |
            build/k8s-release/staging
            build/k8s-release/staging.rendered.yaml
