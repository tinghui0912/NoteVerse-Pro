name: Container Images

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/backend/**"
      - "docker/frontend/**"
      - ".github/workflows/container-images.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/backend/**"
      - "docker/frontend/**"
      - ".github/workflows/container-images.yml"

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH_IMAGES: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      PUSH_DEPENDENCY_IMAGES: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/noteverse" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve practice dependency image
        run: |
          PRACTICE_DEPS_HASH="$(
            sha256sum \
              docker/backend/Dockerfile.practice-deps \
              backend/requirements/practice-app.txt \
              backend/requirements/practice-runtime.txt \
              backend/requirements/practice-runtime-constraints.txt \
            | sha256sum \
            | cut -c1-16
          )"
          echo "PRACTICE_DEPS_HASH=${PRACTICE_DEPS_HASH}" >> "$GITHUB_ENV"
          echo "PRACTICE_DEPS_IMAGE=${IMAGE_NAMESPACE}/backend-practice-deps:deps-${PRACTICE_DEPS_HASH}" >> "$GITHUB_ENV"

      - name: Check practice dependency changes
        run: |
          set -euo pipefail
          PRACTICE_DEPS_CHANGED=false

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PRACTICE_DEPS_CHANGED=true
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${BASE_REF}"
            if ! git diff --quiet "origin/${BASE_REF}...HEAD" -- \
              docker/backend/Dockerfile.practice-deps \
              backend/requirements/practice-app.txt \
              backend/requirements/practice-runtime.txt \
              backend/requirements/practice-runtime-constraints.txt; then
              PRACTICE_DEPS_CHANGED=true
            fi
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              PRACTICE_DEPS_CHANGED=true
            elif ! git diff --quiet "${BEFORE_SHA}...HEAD" -- \
              docker/backend/Dockerfile.practice-deps \
              backend/requirements/practice-app.txt \
              backend/requirements/practice-runtime.txt \
              backend/requirements/practice-runtime-constraints.txt; then
              PRACTICE_DEPS_CHANGED=true
            fi
          fi

          echo "PRACTICE_DEPS_CHANGED=${PRACTICE_DEPS_CHANGED}" >> "$GITHUB_ENV"

      - name: Build backend API runtime image
        id: backend-api-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend/Dockerfile.api
          push: ${{ env.PUSH_IMAGES == 'true' }}
          load: ${{ env.PUSH_IMAGES != 'true' }}
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/backend-api:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/backend-api:build-${{ github.run_id }}
      - name: Build backend beat runtime image
        id: backend-beat-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend/Dockerfile.beat
          push: ${{ env.PUSH_IMAGES == 'true' }}
          load: ${{ env.PUSH_IMAGES != 'true' }}
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/backend-beat:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/backend-beat:build-${{ github.run_id }}
      - name: Build backend practice dependency image
        if: env.PRACTICE_DEPS_CHANGED == 'true'
        run: |
          docker build \
            -f docker/backend/Dockerfile.practice-deps \
            -t "${PRACTICE_DEPS_IMAGE}" \
            -t "${IMAGE_NAMESPACE}/backend-practice-deps:build-${GITHUB_RUN_ID}" \
            .
          if [ "${PUSH_DEPENDENCY_IMAGES}" = "true" ]; then
            docker push "${PRACTICE_DEPS_IMAGE}"
            docker push "${IMAGE_NAMESPACE}/backend-practice-deps:build-${GITHUB_RUN_ID}"
          fi

      - name: Pull backend practice dependency image
        if: env.PRACTICE_DEPS_CHANGED != 'true'
        run: |
          docker pull "${PRACTICE_DEPS_IMAGE}" || {
            echo "::error::Missing ${PRACTICE_DEPS_IMAGE}. Run this workflow manually after practice dependency changes, or publish the matching backend-practice-deps image first."
            exit 1
          }

      - name: Build backend practice runtime image
        run: |
          docker build \
            -f docker/backend/Dockerfile.practice \
            --build-arg "PRACTICE_DEPS_IMAGE=${PRACTICE_DEPS_IMAGE}" \
            -t "${IMAGE_NAMESPACE}/backend-practice:${GITHUB_SHA}" \
            -t "${IMAGE_NAMESPACE}/backend-practice:build-${GITHUB_RUN_ID}" \
            .
          if [ "${PUSH_IMAGES}" = "true" ]; then
            docker push "${IMAGE_NAMESPACE}/backend-practice:${GITHUB_SHA}"
            docker push "${IMAGE_NAMESPACE}/backend-practice:build-${GITHUB_RUN_ID}"
          fi
      - name: Build frontend runtime image
        id: frontend-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend/Dockerfile.runtime
          push: ${{ env.PUSH_IMAGES == 'true' }}
          load: ${{ env.PUSH_IMAGES != 'true' }}
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/frontend:build-${{ github.run_id }}
          build-args: |
            NEXT_BACKEND_ORIGIN=http://noteverse-backend-api:8000
            NEXT_PRACTICE_ORIGIN=http://noteverse-backend-practice:8000
            SESSION_COOKIE_NAME=noteverse_session
            SESSION_REFRESH_COOKIE_NAME=noteverse_refresh

      - name: Generate backend API SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/backend-api:${{ github.sha }}
          format: spdx-json
          artifact-name: backend-api-image-sbom.spdx.json

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          format: spdx-json
          artifact-name: frontend-image-sbom.spdx.json
      - name: Generate backend beat SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/backend-beat:${{ github.sha }}
          format: spdx-json
          artifact-name: backend-beat-image-sbom.spdx.json
      - name: Generate backend practice SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/backend-practice:${{ github.sha }}
          format: spdx-json
          artifact-name: backend-practice-image-sbom.spdx.json

      - name: Scan backend API image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/backend-api:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Scan backend beat image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/backend-beat:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Scan backend practice image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/backend-practice:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Write image build summary
        run: |
          {
            echo "## Container image build"
            echo ""
            echo "- Push images: \`${PUSH_IMAGES}\`"
            echo "- Backend API image: \`${IMAGE_NAMESPACE}/backend-api:${GITHUB_SHA}\`"
            echo "- Backend API digest: \`${{ steps.backend-api-build.outputs.digest }}\`"
            echo "- Backend beat image: \`${IMAGE_NAMESPACE}/backend-beat:${GITHUB_SHA}\`"
            echo "- Backend beat digest: \`${{ steps.backend-beat-build.outputs.digest }}\`"
            echo "- Backend practice deps image: \`${PRACTICE_DEPS_IMAGE}\`"
            echo "- Backend practice deps changed: \`${PRACTICE_DEPS_CHANGED}\`"
            echo "- Backend practice image: \`${IMAGE_NAMESPACE}/backend-practice:${GITHUB_SHA}\`"
            echo "- Backend worker image: build separately from the ML base image before staging/production rollout"
            echo "- Frontend image: \`${IMAGE_NAMESPACE}/frontend:${GITHUB_SHA}\`"
            echo "- Frontend digest: \`${{ steps.frontend-build.outputs.digest }}\`"
            echo "- SBOM artifacts: backend-api-image-sbom.spdx.json, backend-beat-image-sbom.spdx.json, backend-practice-image-sbom.spdx.json, frontend-image-sbom.spdx.json"
            echo "- Vulnerability gate: CRITICAL, ignore unfixed"
          } >> "$GITHUB_STEP_SUMMARY"
