name: Container Images

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/backend/**"
      - "docker/frontend/**"
      - ".github/workflows/container-images.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/backend/**"
      - "docker/frontend/**"
      - ".github/workflows/container-images.yml"

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH_IMAGES: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/noteverse" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend runtime image
        id: backend-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend/Dockerfile.runtime
          push: ${{ env.PUSH_IMAGES == 'true' }}
          load: ${{ env.PUSH_IMAGES != 'true' }}
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/backend:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/backend:build-${{ github.run_id }}
          build-args: |
            PYTHON_IMAGE=python:3.12-slim-bookworm
            INSTALL_DEV_DEPS=false
            INSTALL_GPU_DEPS=false
            INSTALL_PADDLE_GPU=false
            INSTALL_LEGATO_EXTRA_DEPS=false

      - name: Build frontend runtime image
        id: frontend-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend/Dockerfile.runtime
          push: ${{ env.PUSH_IMAGES == 'true' }}
          load: ${{ env.PUSH_IMAGES != 'true' }}
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/frontend:build-${{ github.run_id }}
          build-args: |
            NEXT_BACKEND_ORIGIN=http://noteverse-backend-api:8000
            SESSION_COOKIE_NAME=noteverse_session
            SESSION_REFRESH_COOKIE_NAME=noteverse_refresh

      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/backend:${{ github.sha }}
          format: spdx-json
          artifact-name: backend-image-sbom.spdx.json

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          format: spdx-json
          artifact-name: frontend-image-sbom.spdx.json

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/backend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Write image build summary
        run: |
          {
            echo "## Container image build"
            echo ""
            echo "- Push images: \`${PUSH_IMAGES}\`"
            echo "- Backend image: \`${IMAGE_NAMESPACE}/backend:${GITHUB_SHA}\`"
            echo "- Backend digest: \`${{ steps.backend-build.outputs.digest }}\`"
            echo "- Frontend image: \`${IMAGE_NAMESPACE}/frontend:${GITHUB_SHA}\`"
            echo "- Frontend digest: \`${{ steps.frontend-build.outputs.digest }}\`"
            echo "- SBOM artifacts: backend-image-sbom.spdx.json, frontend-image-sbom.spdx.json"
            echo "- Vulnerability gate: CRITICAL, ignore unfixed"
          } >> "$GITHUB_STEP_SUMMARY"
