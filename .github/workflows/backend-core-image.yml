name: Backend Core Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "!backend/research/**"
      - "docker/backend/Dockerfile.core"
      - "docker/backend/Dockerfile.core.dockerignore"
      - "docker/backend/entrypoint.sh"
      - ".github/workflows/backend-core-image.yml"
      - ".github/actions/backend-service-image/**"
      - ".github/scripts/backend_*.py"
      - ".github/scripts/test_backend_*.py"
      - ".github/scripts/oci_publication.py"
      - ".github/scripts/test_oci_publication.py"
  pull_request:
    paths:
      - "backend/**"
      - "!backend/research/**"
      - "docker/backend/Dockerfile.core"
      - "docker/backend/Dockerfile.core.dockerignore"
      - "docker/backend/entrypoint.sh"
      - ".github/workflows/backend-core-image.yml"
      - ".github/actions/backend-service-image/**"
      - ".github/scripts/backend_*.py"
      - ".github/scripts/test_backend_*.py"
      - ".github/scripts/oci_publication.py"
      - ".github/scripts/test_oci_publication.py"

concurrency:
  group: backend-core-image-${{ github.event_name == 'pull_request' && github.ref || 'trusted-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate core artifact (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUSH_IMAGE: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate local image without registry credentials
        uses: ./.github/actions/backend-service-image
        with:
          publish: "false"

  publish:
    name: Publish core artifact (trusted main)
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH_IMAGE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR for trusted publication
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish and validate the published digest
        uses: ./.github/actions/backend-service-image
        with:
          publish: "true"
