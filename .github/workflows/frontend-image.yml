name: Frontend Image

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - "docker/frontend/**"
      - ".github/workflows/frontend-image.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docker/frontend/**"
      - ".github/workflows/frontend-image.yml"

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH_IMAGE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/noteverse" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build frontend runtime image
        id: frontend-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend/Dockerfile.runtime
          push: ${{ env.PUSH_IMAGE == 'true' }}
          load: ${{ env.PUSH_IMAGE != 'true' }}
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/frontend:build-${{ github.run_id }}
          build-args: |
            NEXT_BACKEND_ORIGIN=http://noteverse-backend-api:8000
            NEXT_PRACTICE_ORIGIN=http://noteverse-backend-practice:8000
            SESSION_COOKIE_NAME=noteverse_session
            SESSION_REFRESH_COOKIE_NAME=noteverse_refresh

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          format: spdx-json
          artifact-name: frontend-image-sbom.spdx.json

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Write image build summary
        run: |
          {
            echo "## Frontend image build"
            echo ""
            echo "- Push image: \`${PUSH_IMAGE}\`"
            echo "- Frontend image: \`${IMAGE_NAMESPACE}/frontend:${GITHUB_SHA}\`"
            echo "- Frontend digest: \`${{ steps.frontend-build.outputs.digest }}\`"
            echo "- SBOM artifact: frontend-image-sbom.spdx.json"
            echo "- Vulnerability gate: CRITICAL, ignore unfixed"
          } >> "$GITHUB_STEP_SUMMARY"
