name: Documentation Quality

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/check_markdown_links.py"
      - "scripts/check_documentation_structure.py"
      - "scripts/test_documentation_structure.py"
      - "scripts/quality.ps1"
      - ".github/workflows/docs-quality.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_markdown_links.py"
      - "scripts/check_documentation_structure.py"
      - "scripts/test_documentation_structure.py"
      - "scripts/quality.ps1"
      - ".github/workflows/docs-quality.yml"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test documentation structure policy
        run: python -m unittest discover -s scripts -p test_documentation_structure.py -v

      - name: Validate documentation structure
        run: python scripts/check_documentation_structure.py

      - name: Validate local Markdown links
        run: python scripts/check_markdown_links.py
