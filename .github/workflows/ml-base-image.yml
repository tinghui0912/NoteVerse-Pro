name: ML Base Image

on:
  workflow_dispatch:
    inputs:
      python_image:
        description: "Pinned Python base image"
        required: true
        default: "python:3.12-slim-bookworm"
      torch_cuda_index:
        description: "PyTorch CUDA wheel index"
        required: true
        default: "cu124"
      image_tag:
        description: "ML base image tag"
        required: true
        default: "py312-torch260-cu124-slim"

concurrency:
  group: ml-base-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/noteverse" >> "$GITHUB_ENV"

      - name: Resolve ML base fingerprint
        id: ml-base-fingerprint
        run: |
          ML_BASE_HASH="$(
            {
              sha256sum docker/backend/Dockerfile.ml-base
              printf '%s\n' '${{ inputs.python_image }}'
              printf '%s\n' '${{ inputs.torch_cuda_index }}'
            } | sha256sum | cut -c1-16
          )"
          echo "ML_BASE_HASH=${ML_BASE_HASH}" >> "$GITHUB_ENV"
          echo "ML_BASE_FINGERPRINT_TAG=ml-${ML_BASE_HASH}" >> "$GITHUB_ENV"
          echo "tag=ml-${ML_BASE_HASH}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Free hosted runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push ML base image
        id: ml-base-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/backend/Dockerfile.ml-base
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/ml-base:${{ inputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/ml-base:${{ steps.ml-base-fingerprint.outputs.tag }}
            ${{ env.IMAGE_NAMESPACE }}/ml-base:build-${{ github.run_id }}
          build-args: |
            PYTHON_IMAGE=${{ inputs.python_image }}
            TORCH_CUDA_INDEX=${{ inputs.torch_cuda_index }}

      - name: Generate ML base SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/ml-base:${{ inputs.image_tag }}
          format: spdx-json
          artifact-name: ml-base-image-sbom.spdx.json

      - name: Scan ML base image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/ml-base:${{ inputs.image_tag }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Write image build summary
        run: |
          {
            echo "## ML base image build"
            echo ""
            echo "- ML base image: \`${IMAGE_NAMESPACE}/ml-base:${{ inputs.image_tag }}\`"
            echo "- ML base fingerprint image: \`${IMAGE_NAMESPACE}/ml-base:${ML_BASE_FINGERPRINT_TAG}\`"
            echo "- ML base digest: \`${{ steps.ml-base-build.outputs.digest }}\`"
            echo "- Python image: \`${{ inputs.python_image }}\`"
            echo "- PyTorch CUDA index: \`${{ inputs.torch_cuda_index }}\`"
            echo "- SBOM artifact: ml-base-image-sbom.spdx.json"
            echo "- Vulnerability gate: CRITICAL, ignore unfixed"
          } >> "$GITHUB_STEP_SUMMARY"
