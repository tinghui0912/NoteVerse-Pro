name: ML Base Image

on:
  workflow_dispatch:
    inputs:
      cuda_image:
        description: "Pinned CUDA runtime base image"
        required: true
        default: "nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04"
      python_version:
        description: "Python version installed by Miniforge"
        required: true
        default: "3.12"
      torch_cuda_index:
        description: "PyTorch CUDA wheel index"
        required: true
        default: "cu124"
      image_tag:
        description: "ML base image tag"
        required: true
        default: "py312-torch260-cu124"

concurrency:
  group: ml-base-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/noteverse" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ML base image
        id: ml-base-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend/Dockerfile.ml-base
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/ml-base:${{ inputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/ml-base:build-${{ github.run_id }}
          build-args: |
            CUDA_IMAGE=${{ inputs.cuda_image }}
            PYTHON_VERSION=${{ inputs.python_version }}
            TORCH_CUDA_INDEX=${{ inputs.torch_cuda_index }}

      - name: Generate ML base SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/ml-base:${{ inputs.image_tag }}
          format: spdx-json
          artifact-name: ml-base-image-sbom.spdx.json

      - name: Scan ML base image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/ml-base:${{ inputs.image_tag }}
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Write image build summary
        run: |
          {
            echo "## ML base image build"
            echo ""
            echo "- ML base image: \`${IMAGE_NAMESPACE}/ml-base:${{ inputs.image_tag }}\`"
            echo "- ML base digest: \`${{ steps.ml-base-build.outputs.digest }}\`"
            echo "- CUDA image: \`${{ inputs.cuda_image }}\`"
            echo "- Python version: \`${{ inputs.python_version }}\`"
            echo "- PyTorch CUDA index: \`${{ inputs.torch_cuda_index }}\`"
            echo "- SBOM artifact: ml-base-image-sbom.spdx.json"
            echo "- Vulnerability gate: CRITICAL, ignore unfixed"
          } >> "$GITHUB_STEP_SUMMARY"
