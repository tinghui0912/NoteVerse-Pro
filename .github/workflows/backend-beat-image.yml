name: Backend Beat Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "!backend/research/**"
      - "docker/backend/Dockerfile.beat"
      - "docker/backend/Dockerfile.beat.dockerignore"
      - "docker/backend/entrypoint.sh"
      - ".github/workflows/backend-beat-image.yml"
      - ".github/actions/backend-service-image/**"
  pull_request:
    paths:
      - "backend/**"
      - "!backend/research/**"
      - "docker/backend/Dockerfile.beat"
      - "docker/backend/Dockerfile.beat.dockerignore"
      - "docker/backend/entrypoint.sh"
      - ".github/workflows/backend-beat-image.yml"
      - ".github/actions/backend-service-image/**"

concurrency:
  group: backend-beat-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate beat artifact (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUSH_IMAGE: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate local image without registry credentials
        uses: ./.github/actions/backend-service-image
        with:
          role: beat
          publish: "false"

  publish:
    name: Publish beat artifact (trusted main)
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH_IMAGE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR for trusted publication
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish and validate the published digest
        uses: ./.github/actions/backend-service-image
        with:
          role: beat
          publish: "true"
