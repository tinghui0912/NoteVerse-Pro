name: Observability Manifests

on:
  push:
    branches: [main]
    paths:
      - "deploy/observability/**"
      - "scripts/check_observability_manifests.py"
      - "scripts/render_observability_helm.py"
      - ".github/workflows/observability-manifests.yml"
  pull_request:
    paths:
      - "deploy/observability/**"
      - "scripts/check_observability_manifests.py"
      - "scripts/render_observability_helm.py"
      - ".github/workflows/observability-manifests.yml"

concurrency:
  group: observability-manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check observability helper syntax
        run: python -m py_compile scripts/check_observability_manifests.py scripts/render_observability_helm.py

      - name: Validate observability values
        run: python scripts/check_observability_manifests.py
