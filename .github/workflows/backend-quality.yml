name: Backend Quality

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: noteverse_test
          POSTGRES_USER: noteverse
          POSTGRES_PASSWORD: noteverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noteverse -d noteverse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-key-that-is-long-enough
      AUTH_COOKIE_NAME: noteverse_session
      REFRESH_COOKIE_NAME: noteverse_refresh
      CSRF_COOKIE_NAME: noteverse_csrf
      CSRF_HEADER_NAME: x-csrf-token
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAMESITE: lax
      FRONTEND_BASE_URL: http://localhost:9002
      PRACTICE_SOUNDFONT_PATH: /tmp/noteverse/practice.sf2
      PLAYBACK_SOUNDFONT_PATH: /tmp/noteverse/playback.sf2
      REALTIME_EVENT_CLEANUP_INTERVAL_SECONDS: "60"
      REALTIME_EVENT_RETENTION_DAYS: "7"
      BACKEND_CORS_ORIGINS: '["http://localhost:9002"]'
      DATABASE_URL: postgresql+asyncpg://noteverse:noteverse@127.0.0.1:5432/noteverse_test
      SYNC_DATABASE_URL: postgresql+psycopg://noteverse:noteverse@127.0.0.1:5432/noteverse_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      LEGATO_REPO_PATH: /tmp/noteverse/legato

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check app tests

      - name: Run mypy
        run: python -m mypy --config-file pyproject.toml

      - name: Run model-layer mypy
        run: python -m mypy --config-file mypy-model-layer.ini

      - name: Run pytest
        run: python -m pytest tests -q
