name: Backend Quality

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/backend/Dockerfile.quality"
      - "docker/backend/Dockerfile.practice-deps"
      - "docker/backend/Dockerfile.practice-quality"
      - "scripts/backend_quality_docker.ps1"
      - "scripts/quality.ps1"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker/backend/Dockerfile.quality"
      - "docker/backend/Dockerfile.practice-deps"
      - "docker/backend/Dockerfile.practice-quality"
      - "scripts/backend_quality_docker.ps1"
      - "scripts/quality.ps1"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read
  packages: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: noteverse_test
          POSTGRES_USER: noteverse
          POSTGRES_PASSWORD: noteverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noteverse -d noteverse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      QUALITY_IMAGE: noteverse-backend-quality:ci
      PRACTICE_DEPS_IMAGE: noteverse-backend-practice-deps:ci
      PRACTICE_QUALITY_IMAGE: noteverse-backend-practice-quality:ci
      QUALITY_ENV_FILE: /tmp/backend-quality.env
      SECRET_KEY: ci-test-secret-key-that-is-long-enough
      AUTH_COOKIE_NAME: noteverse_session
      REFRESH_COOKIE_NAME: noteverse_refresh
      CSRF_COOKIE_NAME: noteverse_csrf
      CSRF_HEADER_NAME: x-csrf-token
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAMESITE: lax
      CONTROL_PLANE_AUTH_COOKIE_NAME: noteverse_control_session
      CONTROL_PLANE_CSRF_COOKIE_NAME: noteverse_control_csrf
      CONTROL_PLANE_CSRF_HEADER_NAME: x-control-csrf-token
      CONTROL_PLANE_COOKIE_SECURE: "false"
      CONTROL_PLANE_COOKIE_SAMESITE: lax
      CONTROL_PLANE_SESSION_EXPIRE_MINUTES: "30"
      CONTROL_PLANE_CORS_ORIGINS: '["http://localhost:3001"]'
      LOG_FORMAT: json
      FRONTEND_BASE_URL: http://localhost:3000
      PRACTICE_SOUNDFONT_PATH: /tmp/noteverse/practice.sf2
      PLAYBACK_SOUNDFONT_PATH: /tmp/noteverse/playback.sf2
      REALTIME_EVENT_CLEANUP_INTERVAL_SECONDS: "60"
      REALTIME_EVENT_RETENTION_DAYS: "7"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
      TRUSTED_PROXY_CIDRS: '[]'
      DATABASE_URL: postgresql+asyncpg://noteverse:noteverse@127.0.0.1:5432/noteverse_test
      SYNC_DATABASE_URL: postgresql+psycopg://noteverse:noteverse@127.0.0.1:5432/noteverse_test
      SCHEDULER_LOCK_DATABASE_URL: postgresql+psycopg://noteverse:noteverse@127.0.0.1:5432/noteverse_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      HF_MODEL_REPOSITORIES: '["guangyangmusic/legato","meta-llama/Llama-3.2-11B-Vision"]'
      LEGATO_REPO_PATH: /tmp/noteverse/legato

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build backend quality image
        run: docker build -f ../docker/backend/Dockerfile.quality -t "$QUALITY_IMAGE" ..

      - name: Build backend practice dependency image
        run: docker build -f ../docker/backend/Dockerfile.practice-deps -t "$PRACTICE_DEPS_IMAGE" ..

      - name: Build backend practice quality image
        run: >-
          docker build
          -f ../docker/backend/Dockerfile.practice-quality
          --build-arg PRACTICE_DEPS_IMAGE="$PRACTICE_DEPS_IMAGE"
          -t "$PRACTICE_QUALITY_IMAGE"
          ..

      - name: Write backend quality environment
        run: |
          cat > "$QUALITY_ENV_FILE" <<EOF
          SECRET_KEY=$SECRET_KEY
          AUTH_COOKIE_NAME=$AUTH_COOKIE_NAME
          REFRESH_COOKIE_NAME=$REFRESH_COOKIE_NAME
          CSRF_COOKIE_NAME=$CSRF_COOKIE_NAME
          CSRF_HEADER_NAME=$CSRF_HEADER_NAME
          AUTH_COOKIE_SECURE=$AUTH_COOKIE_SECURE
          AUTH_COOKIE_SAMESITE=$AUTH_COOKIE_SAMESITE
          CONTROL_PLANE_AUTH_COOKIE_NAME=$CONTROL_PLANE_AUTH_COOKIE_NAME
          CONTROL_PLANE_CSRF_COOKIE_NAME=$CONTROL_PLANE_CSRF_COOKIE_NAME
          CONTROL_PLANE_CSRF_HEADER_NAME=$CONTROL_PLANE_CSRF_HEADER_NAME
          CONTROL_PLANE_COOKIE_SECURE=$CONTROL_PLANE_COOKIE_SECURE
          CONTROL_PLANE_COOKIE_SAMESITE=$CONTROL_PLANE_COOKIE_SAMESITE
          CONTROL_PLANE_SESSION_EXPIRE_MINUTES=$CONTROL_PLANE_SESSION_EXPIRE_MINUTES
          CONTROL_PLANE_CORS_ORIGINS=$CONTROL_PLANE_CORS_ORIGINS
          LOG_FORMAT=$LOG_FORMAT
          FRONTEND_BASE_URL=$FRONTEND_BASE_URL
          PRACTICE_SOUNDFONT_PATH=$PRACTICE_SOUNDFONT_PATH
          PLAYBACK_SOUNDFONT_PATH=$PLAYBACK_SOUNDFONT_PATH
          REALTIME_EVENT_CLEANUP_INTERVAL_SECONDS=$REALTIME_EVENT_CLEANUP_INTERVAL_SECONDS
          REALTIME_EVENT_RETENTION_DAYS=$REALTIME_EVENT_RETENTION_DAYS
          BACKEND_CORS_ORIGINS=$BACKEND_CORS_ORIGINS
          TRUSTED_PROXY_CIDRS=$TRUSTED_PROXY_CIDRS
          DATABASE_URL=$DATABASE_URL
          SYNC_DATABASE_URL=$SYNC_DATABASE_URL
          SCHEDULER_LOCK_DATABASE_URL=$SCHEDULER_LOCK_DATABASE_URL
          REDIS_URL=$REDIS_URL
          CELERY_BROKER_URL=$CELERY_BROKER_URL
          CELERY_RESULT_BACKEND=$CELERY_RESULT_BACKEND
          HF_MODEL_REPOSITORIES=$HF_MODEL_REPOSITORIES
          LEGATO_REPO_PATH=$LEGATO_REPO_PATH
          EOF

      - name: Run Ruff
        run: docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -lc "python -m ruff check app tests scripts"

      - name: Run mypy
        run: docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -lc "python -m mypy --config-file pyproject.toml"

      - name: Run model-layer mypy
        run: docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -lc "python -m mypy --config-file mypy-model-layer.ini"

      - name: Verify OpenAPI contracts
        run: |
          docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -lc "python scripts/export_openapi.py customer-api --check"
          docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -lc "python scripts/export_openapi.py control-plane-api --check"
          docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$PRACTICE_QUALITY_IMAGE" bash -lc "python scripts/export_openapi.py practice-api --check"

      - name: Run database migrations
        run: docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -lc "python -m alembic upgrade head"

      - name: Run core pytest
        run: >-
          docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -lc
          "python -m pytest tests -q
          --ignore=tests/test_practice_api_smoke.py
          --ignore=tests/test_practice_audio_replay_evaluation.py
          --ignore=tests/test_practice_runtime_regressions.py
          --ignore=tests/test_practice_websocket_flow.py"

      - name: Run practice pytest
        run: >-
          docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$PRACTICE_QUALITY_IMAGE" bash -lc
          "python -m pytest
          tests/test_practice_api_smoke.py
          tests/test_practice_audio_replay_evaluation.py
          tests/test_practice_runtime_regressions.py
          tests/test_practice_websocket_flow.py
          -q"
