name: Backend Quality

on:
  push:
    branches: [main]
    paths:
      - "contracts/http/customer-browser-protocol.json"
      - "contracts/http/control-plane-browser-protocol.json"
      - "scripts/generate_customer_browser_protocol.py"
      - "contracts/realtime/events.schema.json"
      - "scripts/generate_realtime_contract.py"
      - "scripts/generate_control_plane_browser_protocol.py"
      - "contracts/practice/acoustic/runtime-contract.json"
      - "scripts/generate_practice_acoustic_runtime.py"
      - "scripts/verify_practice_acoustic_implementation.py"
      - "apps/customer-web/tests/attestations/practice-acoustic/**"
      - "apps/customer-web/src/lib/practice/acoustic/**"
      - "apps/customer-web/public/model-assets/practice-acoustic/**"
      - "apps/customer-web/package.json"
      - "contracts/practice/recording-timebase.schema.json"
      - "scripts/generate_practice_recording_timebase.py"
      - "contracts/practice/recording-media-admission.json"
      - "scripts/generate_practice_recording_media_admission.py"
      - "contracts/score/tempo-policy.json"
      - "scripts/generate_score_tempo_policy.py"
      - "backend/**"
      - "!backend/research/**"
      - "apps/customer-web/src/lib/practice/__fixtures__/canonical-practice-score-artifact.json"
      - "docker/backend/Dockerfile.quality"
      - "docker/backend/Dockerfile.quality.dockerignore"
      - "scripts/check_practice_score_artifact_fixture.py"
      - "scripts/generate_practice_score_contract.py"
      - "contracts/practice/score/**"
      - "scripts/backend_quality_docker.ps1"
      - "scripts/quality.ps1"
      - ".github/workflows/backend-quality.yml"
      - ".github/scripts/*.py"
  pull_request:
    paths:
      - "contracts/http/customer-browser-protocol.json"
      - "contracts/http/control-plane-browser-protocol.json"
      - "scripts/generate_customer_browser_protocol.py"
      - "contracts/realtime/events.schema.json"
      - "scripts/generate_realtime_contract.py"
      - "scripts/generate_control_plane_browser_protocol.py"
      - "contracts/practice/acoustic/runtime-contract.json"
      - "scripts/generate_practice_acoustic_runtime.py"
      - "scripts/verify_practice_acoustic_implementation.py"
      - "apps/customer-web/tests/attestations/practice-acoustic/**"
      - "apps/customer-web/src/lib/practice/acoustic/**"
      - "apps/customer-web/public/model-assets/practice-acoustic/**"
      - "apps/customer-web/package.json"
      - "contracts/practice/recording-timebase.schema.json"
      - "scripts/generate_practice_recording_timebase.py"
      - "contracts/practice/recording-media-admission.json"
      - "scripts/generate_practice_recording_media_admission.py"
      - "contracts/score/tempo-policy.json"
      - "scripts/generate_score_tempo_policy.py"
      - "backend/**"
      - "!backend/research/**"
      - "apps/customer-web/src/lib/practice/__fixtures__/canonical-practice-score-artifact.json"
      - "docker/backend/Dockerfile.quality"
      - "docker/backend/Dockerfile.quality.dockerignore"
      - "scripts/check_practice_score_artifact_fixture.py"
      - "scripts/generate_practice_score_contract.py"
      - "contracts/practice/score/**"
      - "scripts/backend_quality_docker.ps1"
      - "scripts/quality.ps1"
      - ".github/workflows/backend-quality.yml"
      - ".github/scripts/*.py"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: noteverse_test
          POSTGRES_USER: noteverse
          POSTGRES_PASSWORD: noteverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noteverse -d noteverse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      QUALITY_IMAGE: noteverse-backend-quality:ci
      QUALITY_ENV_FILE: /tmp/backend-quality.env
      SECRET_KEY: ci-test-secret-key-that-is-long-enough
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAMESITE: lax
      CONTROL_PLANE_COOKIE_SECURE: "false"
      CONTROL_PLANE_COOKIE_SAMESITE: lax
      CONTROL_PLANE_SESSION_EXPIRE_MINUTES: "30"
      CONTROL_PLANE_CORS_ORIGINS: '["http://localhost:3001"]'
      LOG_FORMAT: json
      FRONTEND_BASE_URL: http://localhost:3000
      PLAYBACK_SOUNDFONT_PATH: /tmp/noteverse/playback.sf2
      REALTIME_EVENT_CLEANUP_INTERVAL_SECONDS: "60"
      REALTIME_EVENT_RETENTION_DAYS: "7"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
      TRUSTED_PROXY_CIDRS: '[]'
      DATABASE_URL: postgresql+psycopg://noteverse:noteverse@127.0.0.1:5432/noteverse_test
      SCHEDULER_LOCK_DATABASE_URL: postgresql+psycopg://noteverse:noteverse@127.0.0.1:5432/noteverse_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      LEGATO_REPO_PATH: /tmp/noteverse/legato

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend quality image
        run: docker build -f ../docker/backend/Dockerfile.quality -t "$QUALITY_IMAGE" ..

      - name: Check native uv project lock (read-only checkout)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE/backend:/project:ro" --entrypoint uv
          "$QUALITY_IMAGE" lock --project /project --check

      - name: Check Worker workflow trust and promotion contracts
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" --entrypoint python
          "$QUALITY_IMAGE" /repo/.github/scripts/backend_worker_image_publication.py check-workflows --repo /repo

      - name: Check API/Beat candidate publication contracts
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" --entrypoint python
          "$QUALITY_IMAGE" /repo/.github/scripts/backend_service_image_publication.py check-workflows --repo /repo

      - name: Write backend quality environment
        run: |
          cat > "$QUALITY_ENV_FILE" <<EOF
          SECRET_KEY=$SECRET_KEY
          AUTH_COOKIE_SECURE=$AUTH_COOKIE_SECURE
          AUTH_COOKIE_SAMESITE=$AUTH_COOKIE_SAMESITE
          CONTROL_PLANE_COOKIE_SECURE=$CONTROL_PLANE_COOKIE_SECURE
          CONTROL_PLANE_COOKIE_SAMESITE=$CONTROL_PLANE_COOKIE_SAMESITE
          CONTROL_PLANE_SESSION_EXPIRE_MINUTES=$CONTROL_PLANE_SESSION_EXPIRE_MINUTES
          CONTROL_PLANE_CORS_ORIGINS=$CONTROL_PLANE_CORS_ORIGINS
          LOG_FORMAT=$LOG_FORMAT
          FRONTEND_BASE_URL=$FRONTEND_BASE_URL
          PLAYBACK_SOUNDFONT_PATH=$PLAYBACK_SOUNDFONT_PATH
          REALTIME_EVENT_CLEANUP_INTERVAL_SECONDS=$REALTIME_EVENT_CLEANUP_INTERVAL_SECONDS
          REALTIME_EVENT_RETENTION_DAYS=$REALTIME_EVENT_RETENTION_DAYS
          BACKEND_CORS_ORIGINS=$BACKEND_CORS_ORIGINS
          TRUSTED_PROXY_CIDRS=$TRUSTED_PROXY_CIDRS
          DATABASE_URL=$DATABASE_URL
          SCHEDULER_LOCK_DATABASE_URL=$SCHEDULER_LOCK_DATABASE_URL
          REDIS_URL=$REDIS_URL
          CELERY_BROKER_URL=$CELERY_BROKER_URL
          CELERY_RESULT_BACKEND=$CELERY_RESULT_BACKEND
          LEGATO_REPO_PATH=$LEGATO_REPO_PATH
          EOF

      - name: Verify Practice runtime projections, implementation evidence and producer fixture
        run: >-
          docker run --rm --network host --env-file "$QUALITY_ENV_FILE"
          -v "$GITHUB_WORKSPACE:/repo:ro"
          "$QUALITY_IMAGE" bash -c
          "cd /repo &&
          python scripts/generate_realtime_contract.py --check &&
          python scripts/generate_customer_browser_protocol.py --check &&
          python scripts/generate_control_plane_browser_protocol.py --check &&
          python scripts/generate_practice_acoustic_runtime.py --check &&
          python scripts/verify_practice_acoustic_implementation.py &&
          python scripts/generate_score_tempo_policy.py --check &&
          python scripts/generate_practice_recording_media_admission.py --check &&
          python scripts/generate_practice_recording_timebase.py --check &&
          python scripts/generate_practice_score_contract.py --check &&
          PYTHONPATH=/repo/backend python scripts/check_practice_score_artifact_fixture.py &&
          PYTHONPATH=/repo/backend python scripts/check_practice_score_artifact_fixture.py --self-test-missing-fixture"

      - name: Run Ruff
        run: docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -c "python -m ruff check app tests scripts"

      - name: Run mypy
        run: docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -c "python -m mypy --config-file pyproject.toml"

      - name: Run backend artifact contract mypy
        run: docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" python -m mypy --config-file pyproject.toml scripts/check_image_contract.py

      - name: Run CI trust helper mypy
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro"
          -e MYPYPATH=/repo/.github/scripts "$QUALITY_IMAGE" python -m mypy --config-file pyproject.toml
          /repo/.github/scripts/oci_publication.py /repo/.github/scripts/backend_service_image_publication.py
          /repo/.github/scripts/backend_worker_image_identity.py /repo/.github/scripts/backend_worker_image_publication.py
          /repo/.github/scripts/backend_worker_runner_disk.py

      - name: Run CI policy and trust tests separately
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" "$QUALITY_IMAGE"
          python -m pytest /repo/.github/scripts -q -c /repo/backend/pyproject.toml -p no:cacheprovider

      - name: Run CI trust Ruff
        run: >-
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" "$QUALITY_IMAGE" bash -c
          "python -m ruff check --config /repo/backend/pyproject.toml
          /repo/.github/scripts/backend_*.py /repo/.github/scripts/oci_publication.py
          /repo/.github/scripts/test_backend_*.py /repo/.github/scripts/test_oci_publication.py"

      - name: Run model-layer mypy
        run: docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -c "python -m mypy --config-file mypy-model-layer.ini"

      - name: Verify OpenAPI contracts
        run: |
          docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -c "python scripts/export_openapi.py customer-api --check"
          docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -c "python scripts/export_openapi.py control-plane-api --check"

      - name: Run database migrations
        run: docker run --rm --network host --env-file "$QUALITY_ENV_FILE" "$QUALITY_IMAGE" bash -c "python -m alembic upgrade head"

      - name: Verify fresh PostgreSQL schema contract
        run: >-
          docker run --rm --network host --env-file "$QUALITY_ENV_FILE"
          -e NOTEVERSE_TEST_PRACTICE_BUNDLE_POSTGRES_URL="$DATABASE_URL"
          "$QUALITY_IMAGE" python -m pytest tests/test_database_schema.py -q

      - name: Run full backend pytest
        run: >-
          docker run --rm --network host --env-file "$QUALITY_ENV_FILE"
          -e NOTEVERSE_REPO_ROOT=/repo -v "$GITHUB_WORKSPACE:/repo:ro" "$QUALITY_IMAGE" bash -c
          "python -m pytest tests -q"
